<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace Viewer - Claude Code OpenClaw</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'JetBrains Mono', monospace;
  background: #1c1816;
  color: #ebe0d2;
  font-size: 13px;
  line-height: 1.5;
}

.container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-height: 400px;
}

/* Top bar */
.top-bar {
  padding: 14px 20px;
  background: #1c1816;
  border-bottom: 1px solid #332d28;
  flex-shrink: 0;
}
.top-bar h1 {
  font-size: 14px;
  font-weight: 600;
  color: #D77757;
  margin-bottom: 4px;
}
.top-bar .subtitle {
  font-size: 11px;
  color: #6a6058;
}
.stats-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 8px;
  font-size: 11px;
}
.stat-item {
  color: #6a6058;
}
.stat-item .num { color: #ebe0d2; font-weight: 500; }
.stat-item.read .num { color: #6477e0; }
.stat-item.bash .num { color: #7ec384; }
.step-counter {
  margin-left: auto;
  color: #D77757;
  font-weight: 500;
  font-size: 12px;
}

/* Main area */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Left panel */
.left-panel {
  width: 50%;
  background: #0f0e0c;
  overflow-y: auto;
  border-right: 1px solid #332d28;
  padding: 8px 0;
}
.left-panel::-webkit-scrollbar { width: 6px; }
.left-panel::-webkit-scrollbar-track { background: transparent; }
.left-panel::-webkit-scrollbar-thumb { background: #332d28; border-radius: 3px; }

/* Event rows */
.event-row {
  padding: 8px 14px;
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.event-row:hover { background: #1a1715; }
.event-row.active {
  background: #1f1a16;
  border-left-color: #D77757;
  box-shadow: inset 4px 0 8px -4px rgba(215, 119, 87, 0.3);
}

/* Text event */
.event-row.type-text { border-left-color: #D77757; }
.event-row.type-text .event-content { color: #bfb3a5; font-size: 12px; }

/* Tool use */
.event-row.type-tool_use.tool-Read { border-left-color: #6477e0; }
.event-row.type-tool_use.tool-Bash { border-left-color: #7ec384; }

/* Tool result */
.event-row.type-tool_result {
  padding: 3px 14px 3px 27px;
  opacity: 0.5;
  border-left-color: #332d28;
}
.event-row.type-tool_result .event-content {
  font-size: 11px;
  color: #6a6058;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.event-row.type-tool_result.expanded {
  opacity: 0.8;
  padding: 6px 14px 6px 27px;
}
.event-row.type-tool_result.expanded .event-content {
  white-space: pre-wrap;
  word-break: break-all;
}

/* Badge */
.tool-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
}
.tool-badge.read-badge { background: rgba(100, 119, 224, 0.2); color: #6477e0; }
.tool-badge.bash-badge { background: rgba(126, 195, 132, 0.2); color: #7ec384; }
.tool-badge.text-badge { background: rgba(215, 119, 87, 0.15); color: #D77757; font-size: 10px; }

.event-content {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.event-detail-path {
  color: #ebe0d2;
  font-size: 12px;
}
.event-detail-dim {
  color: #6a6058;
  font-size: 11px;
}

/* Right panel */
.right-panel {
  width: 50%;
  background: #231f1c;
  overflow-y: auto;
  padding: 20px;
}
.right-panel::-webkit-scrollbar { width: 6px; }
.right-panel::-webkit-scrollbar-track { background: transparent; }
.right-panel::-webkit-scrollbar-thumb { background: #332d28; border-radius: 3px; }

.detail-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #6a6058;
  font-size: 12px;
}
.detail-header {
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid #332d28;
}
.detail-header .detail-type {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.detail-header .detail-type.text-type { color: #D77757; }
.detail-header .detail-type.read-type { color: #6477e0; }
.detail-header .detail-type.bash-type { color: #7ec384; }
.detail-header .detail-type.result-type { color: #6a6058; }
.detail-header .detail-name {
  font-size: 13px;
  color: #ebe0d2;
  word-break: break-all;
}
.detail-body {
  font-size: 12px;
  color: #bfb3a5;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.6;
}

/* Heatmap */
.heatmap-section {
  flex-shrink: 0;
  padding: 12px 20px;
  background: #1c1816;
  border-top: 1px solid #332d28;
}
.heatmap-title {
  font-size: 11px;
  color: #6a6058;
  margin-bottom: 8px;
  font-weight: 500;
}
.heatmap-bars {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
}
.heatmap-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
}
.heatmap-bar {
  height: 12px;
  border-radius: 2px;
  min-width: 8px;
}
.heatmap-label {
  color: #6a6058;
  white-space: nowrap;
}
.heatmap-count {
  color: #ebe0d2;
  font-size: 10px;
  font-weight: 500;
}

/* Token proportion bar */
.token-bar-section {
  margin-top: 10px;
}
.token-bar-label {
  font-size: 10px;
  color: #6a6058;
  margin-bottom: 4px;
  font-weight: 500;
}
.token-bar-track {
  height: 20px;
  background: #1a1715;
  border-radius: 4px;
  overflow: hidden;
  display: flex;
}
.token-bar-track .seg {
  height: 100%;
  transition: width 0.35s ease;
  min-width: 0;
}
.token-bar-track .seg-system  { background: #D77757; }
.token-bar-track .seg-tools   { background: #9b7ed8; }
.token-bar-track .seg-history { background: #6477e0; }
.token-bar-track .seg-results { background: #7ec384; }
.token-bar-track .seg-free    { background: #1a1715; }

.token-bar-legend {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 5px;
}
.token-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: #6a6058;
}
.token-legend-swatch {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}
.token-counter {
  margin-left: auto;
  font-size: 11px;
  color: #ebe0d2;
  font-weight: 500;
}
</style>
</head>

// Shorten paths
function shortenPath(p) {
  if (!p) return '';
  // Remove common prefix
  const prefix = '/home/leonliu2020/ry_workspace/real-sessions/claude-code/openclaw/';
  let s = p.replace(prefix, '');
  s = s.replace(/^\.\//,'');
  return s;
}

// Shorten command
function shortenCommand(cmd) {
  if (!cmd) return '';
  let s = cmd.replace(/\/home\/leonliu2020\/ry_workspace\/real-sessions\/claude-code\/openclaw\//g, './');
  if (s.length > 80) s = s.slice(0, 77) + '...';
  return s;
}

// Build timeline

const rightPanel = document.getElementById('rightPanel');
const stepCounter = document.getElementById('stepCounter');

let toolCallCount = 0;

// Track tool call indices
const toolCallIndices = [];
EVENTS.forEach((e, i) => {
  if (e.type === 'tool_use') toolCallIndices.push(i);
});

EVENTS.forEach((ev, idx) => {
  const row = document.createElement('div');
  row.className = 'event-row type-' + ev.type;
  row.dataset.index = idx;

  if (ev.type === 'text') {
    row.innerHTML = '<span class="tool-badge text-badge">T</span>' +
      '<span class="event-content">' + escHtml(ev.text.slice(0, 80)) + (ev.text.length > 80 ? '...' : '') + '</span>';
  } else if (ev.type === 'tool_use') {
    row.classList.add('tool-' + ev.name);
    const badge = ev.name === 'Read'
      ? '<span class="tool-badge read-badge">R</span>'
      : '<span class="tool-badge bash-badge">B</span>';
    const detail = ev.name === 'Read'
      ? '<span class="event-detail-path">' + escHtml(shortenPath(ev.detail)) + '</span>'
      : '<span class="event-detail-path">' + escHtml(shortenCommand(ev.detail)) + '</span>';
    row.innerHTML = badge + '<span class="event-content">' + detail + '</span>';
  } else if (ev.type === 'tool_result') {
    row.innerHTML = '<span class="event-content"><span class="event-detail-dim">&#x251C; result: ' + escHtml((ev.preview || '').slice(0, 60).replace(/\n/g, ' ')) + '...</span></span>';
  }

  row.addEventListener('click', () => selectEvent(idx));
  leftPanel.appendChild(row);
});

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function selectEvent(idx) {
  // Deactivate previous
  if (activeIndex >= 0) {
    const prev = leftPanel.children[activeIndex];
    if (prev) prev.classList.remove('active');
  }
  activeIndex = idx;
  const row = leftPanel.children[idx];
  if (row) {
    row.classList.add('active');
    row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // Toggle tool_result expand
  if (EVENTS[idx].type === 'tool_result') {
    row.classList.toggle('expanded');
  }

  // Update step counter
  const ev = EVENTS[idx];
  if (ev.type === 'tool_use') {
    const toolIdx = toolCallIndices.indexOf(idx) + 1;
    stepCounter.textContent = '第 ' + toolIdx + ' / 51 步';
  } else {
    const nearestTool = toolCallIndices.filter(i => i <= idx).length;
    if (nearestTool > 0) {
      stepCounter.textContent = '第 ' + nearestTool + ' / 51 步';
    } else {
      stepCounter.textContent = '开始分析';
    }
  }

  // Update token proportion bar
  updateTokenBar(idx);

  // Right panel detail
  showDetail(ev);
}

function showDetail(ev) {
  let html = '';
  if (ev.type === 'text') {
    html = '<div class="detail-header"><div class="detail-type text-type">TEXT OUTPUT</div></div>';
    html += '<div class="detail-body">' + escHtml(ev.text) + '</div>';
  } else if (ev.type === 'tool_use') {
    const typeClass = ev.name === 'Read' ? 'read-type' : 'bash-type';
    const label = ev.name === 'Read' ? 'READ FILE' : 'BASH COMMAND';
    html = '<div class="detail-header"><div class="detail-type ' + typeClass + '">' + label + '</div>';
    html += '<div class="detail-name">' + escHtml(ev.name === 'Read' ? shortenPath(ev.detail) : ev.detail) + '</div></div>';
    html += '<div class="detail-body">' + escHtml(ev.detail) + '</div>';
  } else if (ev.type === 'tool_result') {
    html = '<div class="detail-header"><div class="detail-type result-type">TOOL RESULT</div></div>';
    html += '<div class="detail-body">' + escHtml(ev.preview || '(empty)') + '</div>';
  }
  rightPanel.innerHTML = html;
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const next = Math.min(activeIndex + 1, EVENTS.length - 1);
    selectEvent(next);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = Math.max(activeIndex - 1, 0);
    selectEvent(prev);
  }
});

// Build heatmap
function buildHeatmap() {
  const dirCounts = {};
  EVENTS.forEach(ev => {
    if (ev.type === 'tool_use' && ev.name === 'Read') {
      const p = shortenPath(ev.detail);
      const parts = p.split('/');
      const dir = parts.length > 2 ? parts.slice(0, 2).join('/') : parts[0];
      dirCounts[dir] = (dirCounts[dir] || 0) + 1;
    } else if (ev.type === 'tool_use' && ev.name === 'Bash') {
      // Extract directory from find/grep commands
      const m = ev.detail.match(/\.\/src\/([a-z-]+)/);
      if (m) {
        const dir = 'src/' + m[1];
        dirCounts[dir] = (dirCounts[dir] || 0) + 1;
      }
    }
  });

  const sorted = Object.entries(dirCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const maxCount = sorted[0] ? sorted[0][1] : 1;
  const container = document.getElementById('heatmapBars');

  sorted.forEach(([dir, count]) => {
    const width = Math.max(20, (count / maxCount) * 100);
    const color = dir.includes('gateway') ? '#6477e0' :
                  dir.includes('auto-reply') ? '#7ec384' :
                  dir.includes('agent') ? '#D77757' : '#6a6058';
    const item = document.createElement('div');
    item.className = 'heatmap-item';
    item.innerHTML = '<span class="heatmap-label">' + escHtml(dir) + '</span>' +
      '<div class="heatmap-bar" style="width:' + width + 'px;background:' + color + '"></div>' +
      '<span class="heatmap-count">' + count + '</span>';
    container.appendChild(item);
  });
}
buildHeatmap();

const TOKEN_LIMIT = 200000;

// Get interpolated snapshot for any event index
function getTokenSnapshot(eventIdx) {
  // Before first snapshot
  if (eventIdx <= TOKEN_SNAPSHOTS[0][0]) return TOKEN_SNAPSHOTS[0][1];
  // After last snapshot
  const last = TOKEN_SNAPSHOTS[TOKEN_SNAPSHOTS.length - 1];
  if (eventIdx >= last[0]) return last[1];
  // Find surrounding pair and interpolate
  for (let i = 0; i < TOKEN_SNAPSHOTS.length - 1; i++) {
    const [idx0, snap0] = TOKEN_SNAPSHOTS[i];
    const [idx1, snap1] = TOKEN_SNAPSHOTS[i + 1];
    if (eventIdx >= idx0 && eventIdx <= idx1) {
      const t = (eventIdx - idx0) / (idx1 - idx0);
      return {
        system:  Math.round(snap0.system  + (snap1.system  - snap0.system)  * t),
        tools:   Math.round(snap0.tools   + (snap1.tools   - snap0.tools)   * t),
        history: Math.round(snap0.history + (snap1.history - snap0.history) * t),
        results: Math.round(snap0.results + (snap1.results - snap0.results) * t),
      };
    }
  }
  return last[1];
}

function updateTokenBar(eventIdx) {
  const snap = getTokenSnapshot(eventIdx);
  const total = snap.system + snap.tools + snap.history + snap.results;
  const free = TOKEN_LIMIT - total;

  const pctSystem  = (snap.system  / TOKEN_LIMIT) * 100;
  const pctTools   = (snap.tools   / TOKEN_LIMIT) * 100;
  const pctHistory = (snap.history / TOKEN_LIMIT) * 100;
  const pctResults = (snap.results / TOKEN_LIMIT) * 100;
  const pctFree    = (free / TOKEN_LIMIT) * 100;

  document.getElementById('segSystem').style.width  = pctSystem  + '%';
  document.getElementById('segTools').style.width   = pctTools   + '%';
  document.getElementById('segHistory').style.width = pctHistory + '%';
  document.getElementById('segResults').style.width = pctResults + '%';
  document.getElementById('segFree').style.width    = pctFree    + '%';

  // Legend percentages (of total used, for readability — but show % of full window)
  document.getElementById('legendSystem').textContent  = pctSystem.toFixed(1)  + '%';
  document.getElementById('legendTools').textContent   = pctTools.toFixed(1)   + '%';
  document.getElementById('legendHistory').textContent = pctHistory.toFixed(1) + '%';
  document.getElementById('legendResults').textContent = pctResults.toFixed(1) + '%';
  document.getElementById('legendFree').textContent    = pctFree.toFixed(1)    + '%';

  // Counter
  const totalStr = total >= 1000 ? (total / 1000).toFixed(1) + 'k' : total.toString();
  document.getElementById('tokenCounter').textContent = totalStr + ' / 200k';
}

selectEvent(0);
