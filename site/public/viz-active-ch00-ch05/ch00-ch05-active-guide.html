<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ch00–Ch05 正式可视化审阅导览</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg:#f4f0e8; --panel:#fffdf9; --line:#dcd3c5; --ink:#28231e;
    --text:#554c42; --muted:#8a7e71; --accent:#d66f4e; --dark:#26211e; --light:#e7dfd2;
  }
  body {
    margin:0; min-height:100vh; padding:34px 22px 54px;
    color:var(--text);
    background:radial-gradient(circle at 50% 0%,#e9e1d5,transparent 48%),var(--bg);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  main { width:min(1120px,100%); margin:auto; }
  .eyebrow { color:var(--accent); font:800 11px/1.3 ui-monospace,Consolas,monospace; letter-spacing:.14em; }
  h1 { margin:7px 0 8px; color:var(--ink); font-size:clamp(26px,4vw,40px); line-height:1.12; letter-spacing:-.03em; }
  .intro { max-width:750px; margin:0; color:var(--muted); line-height:1.7; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin:24px 0 34px; }
  .stat { padding:13px 15px; border:1px solid var(--line); border-radius:10px; background:rgba(255,253,249,.76); }
  .stat b { display:block; color:var(--ink); font:800 24px/1.1 ui-monospace,Consolas,monospace; }
  .stat span { color:var(--muted); font-size:11px; }
  section { margin:0 0 30px; }
  .section-head { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:10px; }
  h2 { margin:0; color:var(--ink); font-size:18px; }
  .section-meta { color:var(--muted); font-size:11px; }
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
  .card {
    display:flex; min-height:116px; flex-direction:column; justify-content:space-between;
    padding:15px; border:1px solid var(--line); border-radius:11px;
    color:inherit; text-decoration:none; background:var(--panel);
    box-shadow:0 8px 22px rgba(54,43,30,.05); transition:.2s ease;
  }
  .card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 12px 26px rgba(54,43,30,.1); }
  .card-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .chapter { color:var(--accent); font:800 10px ui-monospace,Consolas,monospace; letter-spacing:.09em; }
  .badges { display:flex; gap:5px; }
  .badge { padding:3px 6px; border-radius:5px; font:800 9px ui-monospace,Consolas,monospace; letter-spacing:.06em; }
  .badge.dark { color:#eee5dc; background:var(--dark); }
  .badge.light { color:#685d52; background:var(--light); }
  .badge.shared { color:#5a4897; background:#eee8ff; }
  .title { margin:11px 0 3px; color:var(--ink); font-weight:800; }
  .file { overflow:hidden; color:var(--muted); font:10px ui-monospace,Consolas,monospace; text-overflow:ellipsis; white-space:nowrap; }
  footer { margin-top:34px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
  @media(max-width:780px) {
    .stats { grid-template-columns:1fr 1fr; }
    .grid { grid-template-columns:1fr 1fr; }
  }
  @media(max-width:520px) {
    body { padding:24px 14px 40px; }
    .grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<main>
  <div class="eyebrow">OFFICIAL VIZ REVIEW · CH00–CH05</div>
  <h1>正文正式引用可视化</h1>
  <p class="intro">这份目录只收录 Ch00–Ch05 当前正文真实引用的组件。点击任意卡片会打开本目录中的独立副本，不会混入候选稿、旧稿组件或后续章节实验。</p>

  <div class="stats">
    <div class="stat"><b>24</b><span>独立 HTML</span></div>
    <div class="stat"><b>25</b><span>正文嵌入位置</span></div>
    <div class="stat"><b>12</b><span>暗色实验台</span></div>
    <div class="stat"><b>12</b><span>浅色解释卡</span></div>
  </div>

  <div id="chapters"></div>

  <footer>快照来源：<code>docs/ch00.md</code>–<code>docs/ch05.md</code> 当前的 <code>&lt;Viz&gt;</code> 引用。共用组件只复制一份，但会在相关章节中同时显示。</footer>
</main>

<script>
const items = [
  {ch:"Ch00",title:"Whale CLI 运行过程",file:"ch00-whale-cli-autoplay.html",theme:"dark"},
  {ch:"Ch00",title:"2022 年桌面调试工作流",file:"ch00-desktop-debug.html",theme:"dark"},
  {ch:"Ch00",title:"鲸鱼带你看 Agent Loop",file:"ch00-whale-chat.html",theme:"light"},
  {ch:"Ch00",title:"渐进式能力解锁",file:"ch00-capability-unlock.html",theme:"light"},
  {ch:"Ch00",title:"OpenClaw Trace 回放",file:"ch00-trace-viewer.html",theme:"dark"},
  {ch:"Ch00",title:"交互式代码解读",file:"ch00-ch03-code-explainer.html",theme:"dark",shared:true},
  {ch:"Ch00",title:"Prompt 组装可视化",file:"ch00-prompt-assembly.html",theme:"dark"},

  {ch:"Ch01",title:"工具描述写法对比",file:"ch01-schema-compare.html",theme:"dark"},
  {ch:"Ch01",title:"Tool Call 与 Result 顺序",file:"ch01-message-order.html",theme:"light"},
  {ch:"Ch01",title:"最小 Agent Loop",file:"ch01-minimal-loop.html",theme:"dark"},
  {ch:"Ch01",title:"代码—终端联动",file:"ch01-code-terminal.html",theme:"light"},
  {ch:"Ch01",title:"Messages 增长过程",file:"ch01-messages-growth.html",theme:"dark"},
  {ch:"Ch01",title:"Messages 四种 Role",file:"ch01-messages-roles.html",theme:"dark"},

  {ch:"Ch02",title:"工具调用分发",file:"ch02-tool-call-dispatch.html",theme:"light"},
  {ch:"Ch02",title:"Registry 注册实验",file:"ch02-registry-animation.html",theme:"dark"},
  {ch:"Ch02",title:"Schema Playground",file:"ch02-schema-playground.html",theme:"light"},

  {ch:"Ch03",title:"Read 上下文占用对比",file:"ch03-read-context-compare.html",theme:"light"},
  {ch:"Ch03",title:"文件类型检测",file:"ch03-binary-detection.html",theme:"dark"},
  {ch:"Ch03",title:"Read 路由分流",file:"ch03-read-routing.html",theme:"light"},
  {ch:"Ch03",title:"read_file 逐行解读",file:"ch00-ch03-code-explainer.html",theme:"dark",shared:true},

  {ch:"Ch04",title:"old_string 匹配扫描",file:"ch04-match-scan.html",theme:"dark"},
  {ch:"Ch04",title:"两种定位方式对比",file:"ch04-edit-locate-duel.html",theme:"light"},
  {ch:"Ch04",title:"Edit 失败后的自我修正",file:"ch04-edit-self-correct.html",theme:"light"},

  {ch:"Ch05",title:"没有搜索工具时",file:"ch05-search-without-tools.html",theme:"light"},
  {ch:"Ch05",title:"搜索范围逐轮收敛",file:"ch05-search-narrowing.html",theme:"light"}
];

const root = document.getElementById("chapters");
for (const ch of ["Ch00","Ch01","Ch02","Ch03","Ch04","Ch05"]) {
  const group = items.filter(item => item.ch === ch);
  const section = document.createElement("section");
  section.innerHTML =
    '<div class="section-head"><h2>' + ch + '</h2><div class="section-meta">' +
    group.length + ' 个正文位置</div></div><div class="grid"></div>';
  const grid = section.querySelector(".grid");
  for (const item of group) {
    const card = document.createElement("a");
    card.className = "card";
    card.href = item.file;
    card.target = "_blank";
    card.rel = "noreferrer";
    card.innerHTML =
      '<div><div class="card-top"><span class="chapter">' + item.ch + '</span><span class="badges">' +
      '<span class="badge ' + item.theme + '">' + (item.theme === "dark" ? "DARK" : "LIGHT") + '</span>' +
      (item.shared ? '<span class="badge shared">SHARED</span>' : '') +
      '</span></div><div class="title">' + item.title + '</div></div>' +
      '<div class="file">' + item.file + '</div>';
    grid.appendChild(card);
  }
  root.appendChild(section);
}
</script>
</body>
</html>
