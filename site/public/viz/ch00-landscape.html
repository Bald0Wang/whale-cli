<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'JetBrains Mono',monospace;
  background:#1c1816;
  color:#ebe0d2;
  padding:20px;
  min-height:100vh;
}
.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
}
.tab{
  padding:6px 14px;
  background:#231f1c;
  color:#ebe0d2;
  border:1px solid #332d28;
  border-radius:16px;
  cursor:pointer;
  font-family:inherit;
  font-size:12px;
  font-weight:500;
  transition:background .2s,color .2s,border-color .2s;
  user-select:none;
}
.tab:hover{
  border-color:#D77757;
  color:#D77757;
}
.tab.active{
  background:#D77757;
  color:#1c1816;
  border-color:#D77757;
  font-weight:600;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
}
.card{
  background:#231f1c;
  border:1px solid #332d28;
  border-radius:8px;
  padding:14px 16px;
  transition:border-color .25s,box-shadow .25s;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.card:hover{
  border-color:#D77757;
  box-shadow:0 0 12px rgba(215,119,87,.15);
}
.card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.card-name{
  font-size:14px;
  font-weight:700;
  color:#ebe0d2;
  text-decoration:none;
  transition:color .2s;
}
.card-name:hover{
  color:#D77757;
}
.card-badge{
  font-size:10px;
  padding:2px 8px;
  border-radius:10px;
  white-space:nowrap;
  font-weight:500;
}
.badge-bigco{background:#3d3530;color:#D77757}
.badge-oss{background:#2a3a2c;color:#7ec384}
.badge-ide{background:#2d3048;color:#8b9cf5}
.badge-research{background:#3a3028;color:#e0c07a}
.badge-teach{background:#2e3535;color:#6cc4c4}
.card-org{
  font-size:11px;
  color:#6a6058;
}
.card-desc{
  font-size:12px;
  color:#b5a89a;
  line-height:1.5;
}
.card-link{
  font-size:11px;
  color:#6477e0;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:2px;
  transition:color .2s;
}
.card-link:hover{color:#8b9cf5}
.card-link svg{width:12px;height:12px;fill:currentColor}
.highlight-tag{
  display:inline-block;
  font-size:10px;
  background:#D77757;
  color:#1c1816;
  padding:1px 6px;
  border-radius:6px;
  font-weight:600;
  margin-left:6px;
  vertical-align:middle;
}
</style>
</head>
<body>

<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>

<script>
const CATEGORIES = [
  { id: 'all', label: '全部' },
  { id: 'bigco', label: '大厂 CLI Agent' },
  { id: 'oss', label: '开源 CLI Agent' },
  { id: 'ide', label: 'IDE Agent' },
  { id: 'research', label: '学术 / 研究' },
  { id: 'teach', label: '参考实现 / 教学' }
];

const PROJECTS = [
  {
    name: 'Claude Code',
    org: 'Anthropic（闭源）',
    desc: '本教程主要参照。batteries-included，hooks / skills / subagent / MCP 完整生态',
    cat: 'bigco',
    url: 'https://claude.ai/code',
    linkType: 'website',
    highlight: '本教程参照'
  },
  {
    name: 'Codex CLI',
    org: 'OpenAI',
    desc: '终端 + 云端双线互补',
    cat: 'bigco',
    url: 'https://github.com/openai/codex',
    linkType: 'github'
  },
  {
    name: 'Gemini CLI',
    org: 'Google（开源）',
    desc: '接 Gemini 生态',
    cat: 'bigco',
    url: 'https://github.com/google-gemini/gemini-cli',
    linkType: 'github'
  },
  {
    name: 'kimi-cli',
    org: 'MoonshotAI（开源）',
    desc: '国内 LLM 友好',
    cat: 'bigco',
    url: 'https://github.com/MoonshotAI/kimi-cli',
    linkType: 'github'
  },
  {
    name: 'Aider',
    org: 'Paul Gauthier',
    desc: 'git-native 工作流，2023 年起持续迭代',
    cat: 'oss',
    url: 'https://github.com/Aider-AI/aider',
    linkType: 'github'
  },
  {
    name: 'OpenCode',
    org: 'SST 团队',
    desc: 'Go 语言，75k+ stars',
    cat: 'oss',
    url: 'https://github.com/opencode-ai/opencode',
    linkType: 'github'
  },
  {
    name: 'pi',
    org: 'badlogic (Mario Zechner)',
    desc: '极简路线，默认 4 个工具',
    cat: 'oss',
    url: 'https://github.com/badlogic/pi-mono',
    linkType: 'github'
  },
  {
    name: 'amp',
    org: 'Sourcegraph',
    desc: '基于 Cody 的终端 agent',
    cat: 'oss',
    url: 'https://ampcode.com',
    linkType: 'website'
  },
  {
    name: 'Cursor',
    org: 'Cursor Inc.',
    desc: 'IDE 形态，Composer agent mode',
    cat: 'ide',
    url: 'https://cursor.com',
    linkType: 'website'
  },
  {
    name: 'Cline',
    org: '社区（开源）',
    desc: 'VS Code agent，前身 Claude Dev',
    cat: 'ide',
    url: 'https://github.com/cline/cline',
    linkType: 'github'
  },
  {
    name: 'Windsurf',
    org: 'Codeium',
    desc: 'IDE agent with Cascade',
    cat: 'ide',
    url: 'https://codeium.com/windsurf',
    linkType: 'website'
  },
  {
    name: 'OpenHands',
    org: 'UIUC + 社区（开源）',
    desc: '前身 OpenDevin，有完整论文',
    cat: 'research',
    url: 'https://github.com/All-Hands-AI/OpenHands',
    linkType: 'github'
  },
  {
    name: 'SWE-agent',
    org: 'Princeton（开源）',
    desc: 'Agent-Computer Interface 概念',
    cat: 'research',
    url: 'https://github.com/princeton-nlp/SWE-agent',
    linkType: 'github'
  },
  {
    name: 'OpenHarness',
    org: 'HKUDS（开源）',
    desc: '多 agent 平台',
    cat: 'research',
    url: 'https://github.com/HKUDS/OpenHarness',
    linkType: 'github'
  },
  {
    name: 'mini-coding-agent',
    org: 'Sebastian Raschka',
    desc: '1000 行教学实现',
    cat: 'teach',
    url: 'https://github.com/rasbt/mini-coding-agent',
    linkType: 'github'
  },
  {
    name: 'Whale CLI',
    org: '本教程',
    desc: '你正在学的这个',
    cat: 'teach',
    url: 'https://github.com/xin007-kong/claude-code-design-tutorial-ry',
    linkType: 'github',
    highlight: '本教程项目'
  }
];

const CAT_LABELS = {
  bigco: '大厂',
  oss: '开源',
  ide: 'IDE',
  research: '学术',
  teach: '教学'
};

const CAT_BADGE_CLASS = {
  bigco: 'badge-bigco',
  oss: 'badge-oss',
  ide: 'badge-ide',
  research: 'badge-research',
  teach: 'badge-teach'
};

const githubSVG = '<svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';
const linkSVG = '<svg viewBox="0 0 16 16"><path d="M4.72 3.22a.75.75 0 011.06 0l5 5a.75.75 0 010 1.06l-5 5a.75.75 0 01-1.06-1.06L9.19 8.75 4.72 4.28a.75.75 0 010-1.06z"/></svg>';

let activeCat = 'all';

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = CATEGORIES.map(c =>
    `<button class="tab${c.id === activeCat ? ' active' : ''}" data-cat="${c.id}">${c.label}</button>`
  ).join('');
}

function renderGrid() {
  const el = document.getElementById('grid');
  const filtered = activeCat === 'all' ? PROJECTS : PROJECTS.filter(p => p.cat === activeCat);
  el.innerHTML = filtered.map(p => {
    const icon = p.linkType === 'github' ? githubSVG : linkSVG;
    const linkLabel = p.linkType === 'github' ? 'GitHub' : 'Website';
    const hl = p.highlight ? `<span class="highlight-tag">${p.highlight}</span>` : '';
    return `<div class="card">
      <div class="card-header">
        <a class="card-name" href="${p.url}" target="_blank" rel="noopener">${p.name}${hl}</a>
        <span class="card-badge ${CAT_BADGE_CLASS[p.cat]}">${CAT_LABELS[p.cat]}</span>
      </div>
      <div class="card-org">${p.org}</div>
      <div class="card-desc">${p.desc}</div>
      <a class="card-link" href="${p.url}" target="_blank" rel="noopener">${icon} → ${linkLabel}</a>
    </div>`;
  }).join('');
}

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  activeCat = btn.dataset.cat;
  renderTabs();
  renderGrid();
});

renderTabs();
renderGrid();
</script>
</body>
</html>
