<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一条消息进入 Coding Agent 后发生了什么</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg0:#faf9f5;--bg1:#f5f0e8;--card:#fff;--card2:#fbfaf6;--border:#e6dfd8;--border2:#d9d3c2;--ink:#29261f;--text:#3d382e;--text2:#7d766a;--text3:#b3ac9d;--accent:#d97757;--accent-deep:#c45f3c;--teal:#0e7c66;--green:#2e7d4f;--red:#c2402a;--purple:#8a63c9;--blue:#4a5eb8;--amber:#b8860b;--shadow-sm:0 1px 2px rgba(41,38,31,.05);--shadow-md:0 1px 3px rgba(41,38,31,.06),0 10px 28px -10px rgba(41,38,31,.14);--mono:'JetBrains Mono','SF Mono',monospace;--sans:-apple-system,'Inter',system-ui,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--mono);font-size:13px;background:radial-gradient(1200px 700px at 20% -5%,#fefdf9,var(--bg0) 60%);color:var(--ink);height:100vh;overflow:hidden;}
.wrap{max-width:1400px;margin:0 auto;padding:12px 20px;height:100%;display:flex;flex-direction:column;}
.hdr{margin-bottom:5px;flex-shrink:0;}.hdr h1{font-family:Georgia,'Songti SC',serif;font-size:16px;font-weight:600;}.hdr p{font-size:10px;color:var(--text2);margin-top:1px;font-family:var(--sans);}
/* Pipeline SVG bar */
.pipe-wrap{margin-bottom:5px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow-sm);padding:6px 10px;overflow-x:auto;}
.pipe-wrap svg{display:block;margin:0 auto;}
.cr{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:5px;flex-shrink:0;}
.cb{padding:2px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card);font-size:10px;cursor:pointer;font-family:inherit;color:var(--text);transition:all .15s;}.cb:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}.cb:disabled{opacity:.3;cursor:default;}
.cb.pl{min-width:60px;}.cb.pl.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.sbs{display:flex;gap:2px;margin-left:4px;}.sbtn{padding:1px 6px;border:1px solid var(--border);border-radius:3px;background:var(--card);font-size:8px;cursor:pointer;font-family:inherit;color:var(--text2);}.sbtn.a{background:var(--ink);color:#fff;border-color:var(--ink);}
.sla{margin-left:8px;font-size:10px;color:var(--text2);font-family:var(--sans);}.sla b{color:var(--accent);}

/* Persistent token bar */
.tkbar{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--card);border:1px solid var(--border);border-radius:7px;margin-bottom:5px;flex-shrink:0;box-shadow:var(--shadow-sm);font-size:9px;color:var(--text2);}
.tkbar .trk{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;position:relative;}
.tkbar .fl{height:100%;background:var(--accent);border-radius:3px;transition:width .5s ease;}
.tkbar .tn{font-weight:700;color:var(--accent);min-width:100px;text-align:right;font-variant-numeric:tabular-nums;transition:color .3s;}
.tkbar .tn.warn{color:var(--red);}
.tkbar .delta{font-size:8px;color:var(--green);margin-left:4px;opacity:0;transition:opacity .3s;}.tkbar .delta.show{opacity:1;}

.grid{display:grid;grid-template-columns:1fr 320px;gap:8px;flex:1;min-height:0;}
.sp{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-md);display:flex;flex-direction:column;}
.sh{padding:5px 10px;background:var(--card2);border-bottom:1px solid var(--border);font-size:9px;color:var(--text2);display:flex;align-items:center;gap:5px;}
.sh i{width:7px;height:7px;border-radius:50%;display:block;}.sh i:nth-child(1){background:#f3aba2}.sh i:nth-child(2){background:#f3d9a2}.sh i:nth-child(3){background:#b5d9b2}
.sh .tg{margin-left:auto;font-size:7px;padding:1px 6px;border-radius:3px;font-weight:700;}
.stg{flex:1;overflow:hidden;position:relative;padding:12px;}

/* File tree — VS Code style */
.ctx-split{display:grid;grid-template-columns:200px 1fr;gap:0;height:100%;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.ftree{background:#f0ede5;border-right:1px solid var(--border);overflow-y:auto;padding:2px 0;font-size:9px;}
.ftree-hdr{padding:3px 8px;font-size:7px;font-weight:700;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;}
.fgrp{margin-bottom:1px;}
.fgrp-hdr{display:flex;align-items:center;gap:3px;padding:2px 6px;font-size:8px;font-weight:700;color:var(--text2);cursor:pointer;user-select:none;border-radius:3px;}.fgrp-hdr:hover{background:rgba(0,0,0,.03);}
.fgrp-hdr .chevron{font-size:7px;transition:transform .15s;display:inline-block;width:10px;text-align:center;color:var(--text3);}.fgrp-hdr.closed .chevron{transform:rotate(-90deg);}
.fgrp-hdr .folder-ico{width:14px;height:10px;display:inline-block;}
.fgrp-hdr .folder-ico svg{width:14px;height:10px;}
.fgrp-body{padding-left:6px;}
.fgrp-body.collapsed{display:none;}
.fnode{display:flex;align-items:center;gap:4px;padding:2px 6px 2px 18px;font-size:9px;cursor:pointer;color:var(--text2);border-left:2px solid transparent;opacity:0;transform:translateX(-8px);transition:opacity .3s,transform .3s,background .1s,border-color .1s;border-radius:0 3px 3px 0;}
.fnode.in{opacity:1;transform:translateX(0);}.fnode:hover{background:rgba(217,119,87,.04);}.fnode.sel{background:rgba(217,119,87,.15);border-left-color:var(--accent);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px rgba(217,119,87,.12);}
.fnode .ftk{margin-left:auto;font-size:7px;color:var(--text3);font-weight:600;font-variant-numeric:tabular-nums;}.fnode.sel .ftk{color:var(--accent);}
.fnode .fic{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.fnode .fic svg{width:14px;height:14px;}
.fprev{background:var(--card);overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;}
.fp-t{font-size:9px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.fp-c{font-size:9px;color:var(--text);line-height:1.5;white-space:pre;flex:1;padding:6px 8px;background:var(--card2);border:1px solid var(--border);border-radius:5px;overflow:auto;font-family:var(--mono);}

/* Blocks */
.ab{display:flex;align-items:flex-start;gap:7px;padding:6px 10px;border-radius:6px;border:1.5px solid var(--border);background:var(--card);font-size:9px;opacity:0;transform:translateX(-16px);transition:all .35s cubic-bezier(.34,1.3,.64,1);box-shadow:var(--shadow-sm);cursor:pointer;}.ab.in{opacity:1;transform:translateX(0);}.ab:hover{border-color:var(--accent);}
.ab .al{font-weight:700;font-size:8px;letter-spacing:.03em;margin-bottom:1px;}.ab .ac{font-size:9px;color:var(--text2);line-height:1.35;white-space:pre-wrap;}
.ico{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:8px;font-weight:700;}

/* Terminal */
.tm{background:#2d2a24;border-radius:8px;overflow:hidden;box-shadow:var(--shadow-md);width:100%;max-width:480px;}
.tm-bar{padding:3px 8px;background:#3d3830;display:flex;gap:3px;align-items:center;}.tm-bar i{width:6px;height:6px;border-radius:50%;display:block;}.tm-bar i:nth-child(1){background:#f3aba2}.tm-bar i:nth-child(2){background:#f3d9a2}.tm-bar i:nth-child(3){background:#b5d9b2}.tm-bar span{margin-left:4px;font-size:8px;color:#b3ac9d;}
.tm-body{padding:6px 10px;color:#e8e4d8;font-size:10px;line-height:1.6;min-height:80px;}

/* JSON */
.jb{background:#2d2a24;border-radius:8px;padding:8px 12px;font-size:10px;line-height:1.55;color:#e8e4d8;max-width:440px;width:100%;box-shadow:var(--shadow-md);}
.jl{opacity:0;transform:translateX(-5px);transition:all .22s;padding:1px 0;white-space:pre;}.jl.show{opacity:1;transform:translateX(0);}
.jl[data-tip]:hover{background:rgba(217,119,87,.12);border-radius:3px;cursor:help;}
.jl[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 5px);top:0;padding:2px 6px;background:var(--ink);color:#fff;font-size:8px;border-radius:3px;white-space:nowrap;z-index:10;font-family:var(--sans);}
.jk{color:#7ec4cf;}.js{color:#e8a87c;}

.ins{padding:5px 8px;background:rgba(217,119,87,.04);border:1px solid rgba(217,119,87,.1);border-radius:6px;font-size:9px;color:var(--text);line-height:1.45;margin-top:auto;font-family:var(--sans);}

/* Messages panel */
.mp{background:var(--bg0);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-md);}
.mh{padding:5px 10px;background:var(--card2);border-bottom:1px solid var(--border);font-size:9px;color:var(--text2);display:flex;align-items:center;gap:5px;flex-shrink:0;}
.mh i{width:7px;height:7px;border-radius:50%;display:block;}.mh i:nth-child(1){background:#f3aba2}.mh i:nth-child(2){background:#f3d9a2}.mh i:nth-child(3){background:#b5d9b2}
.vt{font-size:8px;padding:1px 5px;border:1px solid var(--border);border-radius:3px;background:var(--card);cursor:pointer;color:var(--text2);font-family:inherit;margin-left:auto;}.vt:hover{border-color:var(--accent);color:var(--accent);}.vt.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.cnt{font-size:8px;color:var(--text3);margin-left:4px;}
.ms{flex:1;overflow-y:auto;padding:6px;scroll-behavior:smooth;}
.mc{margin-bottom:4px;border-radius:6px;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm);transition:opacity .3s;}
.mc.fresh{animation:fp .5s ease;}@keyframes fp{0%{box-shadow:0 0 0 0 rgba(217,119,87,.25)}50%{box-shadow:0 0 0 3px rgba(217,119,87,.1)}100%{box-shadow:var(--shadow-sm)}}
@keyframes ci{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.mc.old{opacity:.65;}.mc.s{border-left-color:var(--purple);}.mc.u{border-left-color:var(--blue);}.mc.a{border-left-color:var(--accent);}.mc.t{border-left-color:var(--green);}
.mc .mch{padding:3px 7px;display:flex;align-items:center;gap:4px;}
.mc .badge{font-size:6px;font-weight:700;letter-spacing:.05em;padding:1px 4px;border-radius:2px;text-transform:uppercase;}
.bg-s{background:rgba(138,99,201,.1);color:var(--purple);}.bg-u{background:rgba(74,94,184,.1);color:var(--blue);}.bg-a{background:rgba(217,119,87,.1);color:var(--accent);}.bg-t{background:rgba(46,125,79,.1);color:var(--green);}
.mc .mcd{padding:0 7px 4px;font-size:9px;color:var(--text);line-height:1.4;white-space:pre-wrap;word-break:break-all;}
.mc{cursor:pointer;}.mc:hover{border-color:var(--border2);}
.mc .mc-expand{display:none;margin:0 7px 5px;padding:5px 7px;background:#2d2a24;border-radius:4px;font-size:8px;line-height:1.45;color:#e8e4d8;white-space:pre;overflow-x:auto;font-family:var(--mono);}
.mc.open .mc-expand{display:block;animation:ci .25s ease;}
.mc .mc-tk{float:right;font-size:7px;color:var(--text3);font-weight:600;font-variant-numeric:tabular-nums;}
.mc .tc{margin-top:2px;padding:3px 6px;background:var(--card2);border:1px solid var(--border);border-radius:3px;font-size:8px;}.mc .tcn{color:var(--accent);font-weight:700;}.mc .tca{color:var(--text2);}
.rv{display:none;padding:6px;background:#2d2a24;font-size:9px;line-height:1.45;color:#e8e4d8;overflow-y:auto;flex:1;}.rv.show{display:block;}.rv .rk{color:#7ec4cf;}.rv .rs{color:#e8a87c;}.rv .rc{color:#8a9b78;}

/* Loop replay */
.replay-log{font-size:9px;color:var(--text2);line-height:1.5;max-width:400px;text-align:left;font-family:var(--sans);}
.replay-line{opacity:0;transform:translateY(4px);transition:all .3s;padding:2px 0;border-bottom:1px solid rgba(0,0,0,.03);}
.replay-line.show{opacity:1;transform:translateY(0);}
.replay-line .rl-round{font-weight:700;color:var(--accent);font-size:8px;letter-spacing:.03em;}
.replay-line .rl-tool{color:var(--teal);font-weight:600;font-family:var(--mono);}
.replay-line .rl-tk{float:right;color:var(--text3);font-size:8px;font-variant-numeric:tabular-nums;}

@media(max-width:900px){.grid{grid-template-columns:1fr;}.mp{max-height:200px;}.ctx-split{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
<div class="hdr"><h1>一条消息进入 Coding Agent 后发生了什么</h1><p>按 → 逐步推进 · P 播放/暂停 · Step 2 点击文件查看内容 · Step 7 自动回放完整循环</p></div>
<div class="pipe-wrap"><svg id="pipeSvg" viewBox="0 0 700 52" width="700" height="52"></svg></div>
<div class="cr">
  <button class="cb" id="prevB" disabled>&larr;</button>
  <button class="cb pl" id="playB">&#9654; 播放</button>
  <button class="cb" id="nextB">&rarr;</button>
  <div class="sbs"><button class="sbtn" data-s="2200">慢</button><button class="sbtn a" data-s="3500">中</button><button class="sbtn" data-s="5500">详</button></div>
  <span class="sla" id="sla"><b>1</b> · 用户输入</span>
</div>

<!-- Persistent token bar -->
<div class="tkbar" id="tkbar">
  <span>Context budget</span>
  <div class="trk"><div class="fl" id="gtkFl" style="width:0"></div></div>
  <span class="tn" id="gtkN">0 / 128,000</span>
  <span class="delta" id="gtkD"></span>
</div>

<div class="grid">
  <div class="sp"><div class="sh"><i></i><i></i><i></i><span style="margin-left:5px" id="stT">当前步骤</span><span class="tg" id="stTg">用户</span></div><div class="stg" id="stage"></div></div>
  <div class="mp"><div class="mh"><i></i><i></i><i></i><span style="margin-left:3px">messages[]</span><button class="vt" id="rawT">{ } Raw</button><span class="cnt" id="mCnt">0</span></div><div class="ms" id="mScr"></div><div class="rv" id="rawV"></div></div>
</div>
</div>
<script>
const L=['用户输入','组装上下文','调用模型','解析响应','执行工具','结果回注','循环继续'];
const TS=[{bg:'rgba(74,94,184,.1)',c:'var(--blue)',t:'用户'},{bg:'rgba(46,125,79,.1)',c:'var(--green)',t:'Runtime'},{bg:'rgba(217,119,87,.1)',c:'var(--accent)',t:'网络'},{bg:'rgba(217,119,87,.1)',c:'var(--accent)',t:'Runtime'},{bg:'rgba(14,124,102,.1)',c:'var(--teal)',t:'本地执行'},{bg:'rgba(138,99,201,.1)',c:'var(--purple)',t:'消息历史'},{bg:'rgba(46,125,79,.1)',c:'var(--green)',t:'Agent Loop'}];
const SM=[[{r:'u',b:'bg-u',l:'USER',c:'找到 formatToolExecutorRef 函数，\n把注释从 compact 改成 human-readable。',tk:85,raw:'{"role":"user","content":"找到 formatToolExecutorRef 函数，\\n把注释从 compact 改成 human-readable。"}'}],[{r:'s',b:'bg-s',l:'SYSTEM',c:'你是一个代码助手……\n[.claude.md rules 已合并]',tk:2525,raw:'{"role":"system","content":"你是一个代码助手。需要本地文件内容时使用提供的工具...\\n\\n[.claude.md rules]\\n[CLAUDE.md rules]\\n[ai.txt rules]"}'}],[],[{r:'a',b:'bg-a',l:'ASSISTANT',c:'<div class="tc"><span class="tcn">&#9656; grep</span> <span class="tca">pattern: "formatToolExecutorRef"</span></div>',h:1,tk:150,raw:'{"role":"assistant","tool_calls":[{"id":"call_abc123","type":"function","function":{"name":"grep","arguments":"{\\"pattern\\":\\"formatToolExecutorRef\\"}"}}]}'}],[],[{r:'t',b:'bg-t',l:'TOOL',c:'tool_call_id: call_abc123\nsrc/tools/execution.ts:11:\nexport function formatToolExecutorRef...',tk:280,raw:'{"role":"tool","tool_call_id":"call_abc123","content":"src/tools/execution.ts:11:export function formatToolExecutorRef(ref: ToolExecutorRef): string {\\n..."}'}],[]];
const RAW=[
`<span class="rc">// Step 1</span>\nmessages = [{<span class="rk">"role"</span>:<span class="rs">"user"</span>, <span class="rk">"content"</span>:<span class="rs">"找到…"</span>}]`,
`<span class="rc">// Step 2: +system +rules +tools</span>\nmessages = [\n  {<span class="rk">"role"</span>:<span class="rs">"system"</span>, …},\n  {<span class="rk">"role"</span>:<span class="rs">"user"</span>, …}\n]\ntools = [read_file, grep, edit_file, ...]`,
`<span class="rc">// Step 3: sending to API</span>\n<span class="rc">// POST {messages, tools, model}</span>`,
`<span class="rc">// Step 4: model returns</span>\nmessages[2] = {\n  <span class="rk">"role"</span>:<span class="rs">"assistant"</span>,\n  <span class="rk">"tool_calls"</span>:[{<span class="rk">"name"</span>:<span class="rs">"grep"</span>,…}]\n}`,
`<span class="rc">// Step 5: local execution</span>\n<span class="rc">// grep("formatToolExecutorRef")</span>\n<span class="rc">// → "src/tools/execution.ts:11:…"</span>`,
`<span class="rc">// Step 6: append result</span>\nmessages[3] = {\n  <span class="rk">"role"</span>:<span class="rs">"tool"</span>,\n  <span class="rk">"tool_call_id"</span>:<span class="rs">"call_abc123"</span>,\n  <span class="rk">"content"</span>:<span class="rs">"src/tools/…"</span>\n}`,
`<span class="rc">// Step 7: loop back with 4 messages</span>\n<span class="rc">// Round 2: read_file → +2 msgs</span>\n<span class="rc">// Round 3: edit_file → +2 msgs</span>\n<span class="rc">// Round 4: text answer → done</span>`];

// Token budget tracking
const TK_TOTAL=128000;
const TK_PER_STEP=[85, 2525, 0, 150, 0, 280, 0]; // cumulative deltas
let gTokens=0;

function updateTkBar(tokens, delta, showDelta){
  gTokens=tokens;
  const pct=(tokens/TK_TOTAL*100);
  document.getElementById('gtkFl').style.width=pct+'%';
  const tn=document.getElementById('gtkN');
  tn.textContent=tokens.toLocaleString()+' / 128,000';
  tn.classList.toggle('warn',tokens>10000);
  const d=document.getElementById('gtkD');
  if(delta>0&&showDelta!==false){d.textContent='+'+delta;d.classList.add('show');setTimeout(()=>d.classList.remove('show'),1200);}
}

// SVG icons
const ICO={
  md:`<svg viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="1.5" stroke="#b8860b" stroke-width="1.2"/><path d="M5 5h6M5 8h6M5 11h3" stroke="#b8860b" stroke-width=".8" stroke-linecap="round"/></svg>`,
  txt:`<svg viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="1.5" stroke="#7d766a" stroke-width="1.2"/><path d="M5 5h6M5 8h4" stroke="#7d766a" stroke-width=".8" stroke-linecap="round"/></svg>`,
  json:`<svg viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="1.5" stroke="#0e7c66" stroke-width="1.2"/><path d="M5 6c0-1.5 1-2 2-2M11 6c0-1.5-1-2-2-2M5 10c0 1.5 1 2 2 2M11 10c0 1.5-1 2-2 2" stroke="#0e7c66" stroke-width=".8" stroke-linecap="round"/></svg>`,
  sys:`<svg viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="1.5" stroke="#8a63c9" stroke-width="1.2"/><circle cx="8" cy="7" r="2.5" stroke="#8a63c9" stroke-width=".8"/><path d="M8 4.5V3M8 11v-1.5M5.5 7H4M12 7h-1.5M6 5L5 4M11 10l-1-1M10 5l1-1M5 10l1-1" stroke="#8a63c9" stroke-width=".6" stroke-linecap="round"/></svg>`,
  hist:`<svg viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="1.5" stroke="#7d766a" stroke-width="1.2"/><path d="M5 4h6M5 7h4M5 10h5" stroke="#7d766a" stroke-width=".8" stroke-linecap="round" opacity=".5"/></svg>`,
  user:`<svg viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="1.5" stroke="#4a5eb8" stroke-width="1.2"/><circle cx="8" cy="6" r="2" stroke="#4a5eb8" stroke-width=".8"/><path d="M4.5 13c0-2 1.5-3.5 3.5-3.5s3.5 1.5 3.5 3.5" stroke="#4a5eb8" stroke-width=".8" stroke-linecap="round"/></svg>`,
  folder:`<svg viewBox="0 0 16 12" fill="none"><path d="M1 2.5A1.5 1.5 0 012.5 1H6l1.5 2H13.5A1.5 1.5 0 0115 4.5v5.5a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 011 10V2.5z" stroke="currentColor" stroke-width="1.2"/></svg>`,
};
const TREE=[
  {type:'group',label:'system',color:'var(--purple)',files:[

// Build SVG pipeline
const pipeSvg=document.getElementById('pipeSvg');
const PIPE_W=700,SEG_W=82,SEG_H=30,GAP=16,Y0=11,ARROW_W=12;
const PIPE_COLORS=['var(--blue)','var(--green)','var(--accent)','var(--accent)','var(--teal)','var(--purple)','var(--green)'];
const SHORT_L=['输入','组装','调用','解析','执行','回注','循环'];
function buildPipe(){
  let html='<defs><marker id="pa" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto"><polygon points="0 0,6 2,0 4" fill="var(--border2)"/></marker></defs>';
  const totalW=7*SEG_W+6*GAP;const x0=(PIPE_W-totalW)/2;
  for(let i=0;i<7;i++){
    const x=x0+i*(SEG_W+GAP);
    html+=`<rect class="pseg" data-i="${i}" x="${x}" y="${Y0}" width="${SEG_W}" height="${SEG_H}" rx="6" fill="var(--bg1)" stroke="var(--border)" stroke-width="1.2" style="cursor:pointer;transition:all .25s"/>`;
    html+=`<text class="ptxt" data-i="${i}" x="${x+SEG_W/2}" y="${Y0+SEG_H/2+1}" text-anchor="middle" dominant-baseline="middle" font-size="8" font-family="var(--mono)" font-weight="600" fill="var(--text3)" style="pointer-events:none;transition:fill .25s">${i+1}. ${SHORT_L[i]}</text>`;
    if(i<6){
      const ax=x+SEG_W+2,ay=Y0+SEG_H/2;
      html+=`<line class="parr" data-i="${i}" x1="${ax}" y1="${ay}" x2="${ax+GAP-4}" y2="${ay}" stroke="var(--border2)" stroke-width="1.2" marker-end="url(#pa)" style="transition:stroke .25s"/>`;
    }
  }
  // Animated dot — will be updated per step
  html+=`<circle id="pipeDot" r="4" fill="var(--accent)" opacity=".7"/>`;
  // Store segment centers for dot animation
  window._pipeCenters=Array.from({length:7},(_,i)=>({x:x0+i*(SEG_W+GAP)+SEG_W/2,y:Y0+SEG_H/2}));
  pipeSvg.innerHTML=html;
  // Click handlers
  pipeSvg.querySelectorAll('.pseg').forEach(s=>s.onclick=()=>{stopP();goTo(+s.dataset.i);});
}
function updatePipe(step){
  pipeSvg.querySelectorAll('.pseg').forEach(s=>{
    const i=+s.dataset.i;
    if(i<step){s.setAttribute('fill','var(--accent-deep)');s.setAttribute('stroke','var(--accent-deep)');s.setAttribute('stroke-width','1.5');}
    else if(i===step){s.setAttribute('fill','var(--accent)');s.setAttribute('stroke','var(--accent)');s.setAttribute('stroke-width','2');}
    else{s.setAttribute('fill','var(--bg1)');s.setAttribute('stroke','var(--border)');s.setAttribute('stroke-width','1.2');}
  });
  pipeSvg.querySelectorAll('.ptxt').forEach(t=>{
    const i=+t.dataset.i;
    t.setAttribute('fill',i<=step?'#fff':'var(--text3)');
  });
  pipeSvg.querySelectorAll('.parr').forEach(a=>{
    const i=+a.dataset.i;
    a.setAttribute('stroke',i<step?'var(--accent-deep)':'var(--border2)');
  });
  // Animate dot to current step position
  const dot=document.getElementById('pipeDot');
  if(dot&&window._pipeCenters){
    const c=window._pipeCenters[step];
    dot.setAttribute('cx',c.x);dot.setAttribute('cy',c.y);
    dot.style.transition='cx .4s ease, cy .4s ease';
  }
}
buildPipe();

const stage=document.getElementById('stage'),mScr=document.getElementById('mScr'),mCnt=document.getElementById('mCnt'),rawV=document.getElementById('rawV');

function renderM(){
  if(rawMode){mScr.style.display='none';rawV.classList.add('show');rawV.innerHTML='<pre>'+RAW[Math.min(cur,6)]+'</pre>';return;}
  mScr.style.display='';rawV.classList.remove('show');mScr.innerHTML='';
  const nc=(SM[cur]||[]).length;
  allM.forEach((m,i)=>{const isNew=i>=allM.length-nc&&cur<7;const e=document.createElement('div');e.className='mc '+m.r+(isNew?' fresh':cur===6?'':' old');e.style.animation=(isNew||cur===6)?'ci .3s ease':'none';
    let tkBadge=m.tk?`<span class="mc-tk">${m.tk} tk</span>`:'';
    let expandDiv=m.raw?`<div class="mc-expand">${m.raw}</div>`:'';
    e.innerHTML=`<div class="mch"><span class="badge ${m.b}">${m.l}</span>${tkBadge}</div><div class="mcd">${m.c}</div>${expandDiv}`;
    if(m.raw)e.onclick=()=>e.classList.toggle('open');
    mScr.appendChild(e);});
  mCnt.textContent=allM.length+'';
  setTimeout(()=>{mScr.scrollTop=mScr.scrollHeight;},30);
}

function goTo(step){
  cur=step;allM.length=0;for(let i=0;i<=step;i++)(SM[i]||[]).forEach(m=>allM.push(m));
  updatePipe(step);
  document.getElementById('sla').innerHTML=`<b>${step+1}</b> · ${L[step]}`;
  document.getElementById('stT').textContent=L[step];
  const ts=TS[step];const tg=document.getElementById('stTg');tg.textContent=ts.t;tg.style.background=ts.bg;tg.style.color=ts.c;
  document.getElementById('prevB').disabled=step===0;document.getElementById('nextB').innerHTML=step===6?'&#8634;':'&rarr;';
  stage.innerHTML=stageHTML(step);renderM();setTimeout(()=>postRender(step),40);
}

function stopP(){playing=false;clearTimeout(playTimer);document.getElementById('playB').textContent='▶ 播放';document.getElementById('playB').classList.remove('on');}
function startP(){playing=true;document.getElementById('playB').textContent='⏸';document.getElementById('playB').classList.add('on');tick();}
function tick(){if(!playing)return;if(cur<6)playTimer=setTimeout(()=>{goTo(cur+1);tick();},speed);else stopP();}
document.getElementById('prevB').onclick=()=>{stopP();if(cur>0)goTo(cur-1);};
document.getElementById('nextB').onclick=()=>{stopP();goTo(cur===6?0:cur+1);};
document.getElementById('playB').onclick=()=>{if(playing)stopP();else{if(cur===6)goTo(0);startP();}};
document.getElementById('rawT').onclick=function(){rawMode=!rawMode;this.classList.toggle('on',rawMode);renderM();};
document.querySelectorAll('.sbtn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.sbtn').forEach(x=>x.classList.remove('a'));b.classList.add('a');speed=+b.dataset.s;};});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();stopP();goTo(cur===6?0:cur+1);}if(e.key==='ArrowLeft'){e.preventDefault();stopP();if(cur>0)goTo(cur-1);}if(e.key==='p'||e.key==='P'){e.preventDefault();if(playing)stopP();else startP();}});
goTo(0);
</script>
</body>
</html>
