<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Loop · 小鲸鱼陪你走一遍</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Inter',sans-serif;background:#faf9f5;color:#3d382e;min-height:100vh;display:flex;flex-direction:column}
.mono{font-family:'JetBrains Mono','SF Mono',monospace}

/* ── 顶部流水线 ── */
.pipeline{display:flex;align-items:center;justify-content:center;padding:1rem 1rem 0;gap:0;flex-wrap:nowrap;overflow-x:auto;position:relative}
.station{display:flex;flex-direction:column;align-items:center;gap:0.2rem;padding:0.5rem 0.6rem;border-radius:8px;border:1.5px solid #e8e4d8;background:#fff;cursor:pointer;transition:all 0.3s;min-width:68px;position:relative;z-index:1}
.station .s-num{font-family:'JetBrains Mono',monospace;font-size:0.64rem;color:#b3ac9d;font-weight:600;transition:color 0.3s}
.station .s-label{font-size:0.62rem;color:#7d766a;text-align:center;line-height:1.3;transition:color 0.3s}
.station.lit{border-color:#d97757;background:#fffbf8;transform:translateY(-3px);box-shadow:0 4px 12px rgba(217,119,87,0.15)}
.station.lit .s-num{color:#d97757}
.station.lit .s-label{color:#29261f;font-weight:600}
.station.done{border-color:#7ec384;background:#f8fdf9}
.station.done .s-num{color:#7ec384}
.arrow{color:#d9d3c2;font-size:0.8rem;padding:0 0.2rem;transition:color 0.3s;flex-shrink:0}
.arrow.lit{color:#d97757}

/* ── 鲸鱼（浮在流水线上方）── */
.whale-track{position:relative;height:60px;max-width:800px;margin:0 auto;width:100%}
.whale-wrap{position:absolute;transition:left 0.5s cubic-bezier(.34,1.56,.64,1);transform:translateX(-50%)}
.whale-wrap svg{width:50px;height:50px;filter:drop-shadow(0 2px 4px rgba(41,38,31,0.1))}
.whale-body{fill:#5b9bd5;transition:fill 0.3s}
.whale-belly{fill:#a8d4e6}
.whale-eye{fill:#29261f}
.whale-float{animation:whaleFloat 3s ease-in-out infinite}
@keyframes whaleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.whale-bounce{animation:whaleBounce 0.4s ease}
@keyframes whaleBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.bubble{position:absolute;top:-8px;left:55px;background:#fff;border:1px solid #e8e4d8;border-radius:10px;padding:3px 8px;font-size:0.7rem;color:#3d382e;box-shadow:0 2px 6px rgba(41,38,31,0.08);opacity:0;transform:scale(0.8);transition:opacity 0.25s,transform 0.25s;white-space:nowrap;pointer-events:none}
.bubble.show{opacity:1;transform:scale(1)}

/* ── 工作台（左右分栏）── */
.workbench{flex:1;display:flex;gap:0;margin:0.5rem;border-radius:10px;overflow:hidden;border:1px solid #e8e4d8;box-shadow:0 2px 8px rgba(41,38,31,0.06);min-height:0}
@media(max-width:700px){.workbench{flex-direction:column}}

/* 左栏：终端视角 */
.panel{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.panel-header{padding:0.4rem 0.7rem;font-size:0.68rem;font-weight:600;border-bottom:1px solid #e8e4d8;display:flex;align-items:center;gap:0.4rem}
.panel-left .panel-header{background:#1a1816;color:#8a8578}
.panel-right .panel-header{background:#f8f7f3;color:#7d766a}
.panel-body{flex:1;overflow-y:auto;padding:0.6rem 0.7rem;font-size:0.78rem;line-height:1.65}
.panel-left .panel-body{background:#111110;color:#c8c0b4;font-family:'JetBrains Mono',monospace;font-size:0.76rem}
.panel-right .panel-body{background:#fff;font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:#3d382e}
.divider{width:1px;background:#e8e4d8;flex-shrink:0}

/* 终端内容 */
.t-prompt{color:#d97757}
.t-tool{color:#7ec384}
.t-result{color:#7a7468;padding-left:1.2rem;display:block;font-size:0.72rem}
.t-dim{color:#4a4438}
.t-block{margin-bottom:0.5rem;animation:fadeIn 0.3s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* messages 面板 */
.msg{margin-bottom:0.5rem;padding:0.4rem 0.5rem;border-radius:6px;border:1px solid #ece9e0;animation:fadeIn 0.3s ease-out;font-size:0.7rem}
.msg .role{font-size:0.62rem;font-weight:600;margin-bottom:0.15rem}
.msg.user{border-left:3px solid #d97757}.msg.user .role{color:#d97757}
.msg.assistant{border-left:3px solid #7eb8c9}.msg.assistant .role{color:#7eb8c9}
.msg.tool{border-left:3px solid #7ec384}.msg.tool .role{color:#7ec384}
.msg pre{white-space:pre-wrap;word-break:break-all;color:#5a5448;font-size:0.68rem;margin-top:0.15rem}
.msg .highlight{background:rgba(217,119,87,0.08);padding:0.1rem 0.2rem;border-radius:2px}

/* 控制 */
.controls{display:flex;justify-content:center;gap:0.5rem;padding:0.6rem}
.btn{font-family:'JetBrains Mono',monospace;font-size:0.72rem;padding:0.35rem 0.9rem;border-radius:6px;border:1px solid #e8e4d8;background:#fff;color:#7d766a;cursor:pointer;transition:all 0.15s}
.btn:hover{border-color:#d97757;color:#d97757}
.btn-primary{background:#d97757;border-color:#d97757;color:#fff}
.btn-primary:hover{background:#c45f3c}
</style>
</head>
<body>

<!-- 鲸鱼轨道 -->
<div class="whale-track" id="whale-track">
  <div class="whale-wrap whale-float" id="whale-wrap" style="left:10%">
    <div class="bubble" id="bubble"></div>
    <svg viewBox="0 0 60 60" class="whale-float"><ellipse class="whale-body" cx="30" cy="34" rx="20" ry="15"/><ellipse class="whale-belly" cx="28" cy="38" rx="12" ry="9"/><path d="M10,30 Q3,24 7,19 Q12,23 10,30" class="whale-body"/><path d="M10,38 Q3,44 7,49 Q12,43 10,38" class="whale-body"/><path d="M28,19 Q32,13 36,20" class="whale-body"/><circle class="whale-eye" cx="40" cy="30" r="2.2"/><circle cx="42" cy="35" r="2" fill="#e8a0a0" opacity="0.3"/><g id="spout" opacity="0"><ellipse cx="33" cy="13" rx="1.5" ry="3" fill="#a8d4e6"/><ellipse cx="30" cy="9" rx="1" ry="2.5" fill="#a8d4e6"/><ellipse cx="36" cy="10" rx="1" ry="2.5" fill="#a8d4e6"/></g></svg>
  </div>
</div>

<!-- 流水线 -->
<div class="pipeline" id="pipeline"></div>

<!-- 工作台 -->
<div class="workbench">
  <div class="panel panel-left">
    <div class="panel-header">终端（用户看到的）</div>
    <div class="panel-body" id="terminal"></div>
  </div>
  <div class="divider"></div>
  <div class="panel panel-right">
    <div class="panel-header">messages 数组（模型看到的）</div>
    <div class="panel-body" id="messages"></div>
  </div>
</div>

<div class="controls">
  <button class="btn" id="btn-prev">←</button>
  <button class="btn btn-primary" id="btn-next">下一步 →</button>
  <button class="btn" id="btn-reset">重来</button>
</div>

<script>
const STEPS = [
  { label:'输入', bubble:'嗯？',
    term:'<span class="t-prompt">❯</span> 把 README 里的 typo 修一下',
    msgs:[{role:'user',content:'"把 README 里的 typo 修一下"'}],
    detail:'messages 长度: 1' },
  { label:'发 API', bubble:'发出去了',
    term:'<span class="t-dim">  → API 请求: 1 条 message + 7 个工具 schema</span>',
    msgs:[{role:'user',content:'"把 README 里的 typo 修一下"'}],
    detail:'请求 token ≈ 170' },
  { label:'返回\ntool_calls', bubble:'先读一下',
    term:'<span class="t-tool">⏺ read_file</span>({path: "README.md"})',
    msgs:[{role:'user',content:'"把 README 里的 typo 修一下"'},{role:'assistant',content:'<span class="highlight">tool_calls: [{name: "read_file", arguments: {path: "README.md"}}]</span>'}],
    detail:'模型没返回文字,返回了工具调用' },
  { label:'执行\nread_file', bubble:'看到了',
    term:'<span class="t-result">⎿ # README.md (45 lines)\n     12  A CLI <b>codign</b> agent</span>',
    msgs:[{role:'user',content:'"把 README 里的 typo 修一下"'},{role:'assistant',content:'tool_calls: [{name: "read_file", ...}]'},{role:'tool',content:'<span class="highlight">tool_call_id: "call_01"\n"# README.md (45 lines)\\n  12  A CLI codign agent..."</span>'}],
    detail:'文件内容写进 messages,模型下一轮能看到' },
  { label:'返回\ntool_calls', bubble:'这里拼错了',
    term:'<span class="t-tool">⏺ edit_file</span>({old: "codign", new: "coding"})',
    msgs:[{role:'user',content:'...'},{role:'assistant',content:'tool_calls: [read_file]'},{role:'tool',content:'"# README.md..."'},{role:'assistant',content:'<span class="highlight">tool_calls: [{name: "edit_file",\n  arguments: {old_string: "codign", new_string: "coding"}}]</span>'}],
    detail:'模型看到第12行拼错,构造了 old_string' },
  { label:'执行\nedit_file', bubble:'改',
    term:'<span class="t-result">⎿ Applied edit to README.md: 1 line</span>',
    msgs:[{role:'user',content:'...'},{role:'assistant',content:'...'},{role:'tool',content:'...'},{role:'assistant',content:'tool_calls: [edit_file]'},{role:'tool',content:'<span class="highlight">"Applied edit to README.md: replaced 1 lines"</span>'}],
    detail:'text.count("codign") → 1,唯一匹配,替换成功' },
  { label:'返回\ntool_calls', bubble:'还有没有？',
    term:'<span class="t-tool">⏺ grep</span>({pattern: "codign", path: "."})\n<span class="t-result">⎿ 0 matches</span>',
    msgs:[{role:'user',content:'...'},{role:'assistant',content:'...'},{role:'tool',content:'...'},{role:'assistant',content:'...'},{role:'tool',content:'...'},{role:'assistant',content:'<span class="highlight">tool_calls: [{name: "grep", arguments: {pattern: "codign"}}]</span>'},{role:'tool',content:'"0 matches"'}],
    detail:'确认没有其他地方也拼错' },
  { label:'返回\ncontent', bubble:'搞定',
    term:'<span class="t-dim">已修复 README.md 第 12 行: codign → coding</span>',
    msgs:[{role:'user',content:'...'},{role:'assistant',content:'...'},{role:'tool',content:'...'},{role:'assistant',content:'...'},{role:'tool',content:'...'},{role:'assistant',content:'...'},{role:'tool',content:'...'},{role:'assistant',content:'<span class="highlight">content: "已修复 README.md 第 12 行"\ntool_calls: null → 循环退出</span>'}],
    detail:'tool_calls 为空,打印回答。共 4 轮 API 调用' },
];

const pipeline = document.getElementById('pipeline');
const terminal = document.getElementById('terminal');
const messagesEl = document.getElementById('messages');
const whaleWrap = document.getElementById('whale-wrap');
const bubbleEl = document.getElementById('bubble');
const spout = document.getElementById('spout');
const whaleBody = document.querySelector('.whale-body');

// 渲染流水线
pipeline.innerHTML = STEPS.map((s,i) =>
  `${i>0?'<span class="arrow" id="arrow-'+i+'">→</span>':''}<div class="station" data-i="${i}" id="st-${i}"><div class="s-num">${i+1}</div><div class="s-label">${s.label}</div></div>`
).join('');

let current = -1;

function goTo(idx){
  if(idx<0||idx>=STEPS.length)return;
  current=idx;
  const s=STEPS[idx];

  // 流水线
  document.querySelectorAll('.station').forEach((el,i)=>{
    el.classList.toggle('lit',i===idx);
    el.classList.toggle('done',i<idx);
  });
  document.querySelectorAll('.arrow').forEach((el,i)=>{
    el.classList.toggle('lit',i<idx+1);
  });

  // 鲸鱼位置
  const st=document.getElementById('st-'+idx);
  const pipeRect=pipeline.getBoundingClientRect();
  const stRect=st.getBoundingClientRect();
  const pct=((stRect.left+stRect.width/2-pipeRect.left)/pipeRect.width)*100;
  whaleWrap.style.left=pct+'%';

  // 鲸鱼反应
  whaleWrap.classList.remove('whale-bounce');
  void whaleWrap.offsetWidth;
  whaleWrap.classList.add('whale-bounce');
  bubbleEl.textContent=s.bubble;
  bubbleEl.classList.add('show');
  setTimeout(()=>bubbleEl.classList.remove('show'),1500);

  // 鲸鱼颜色
  if(idx===STEPS.length-1){whaleBody.style.fill='#7ec384';spout.setAttribute('opacity','1')}
  else if(s.label.includes('执行')){whaleBody.style.fill='#7eb8c9';spout.setAttribute('opacity','0.7')}
  else{whaleBody.style.fill='#5b9bd5';spout.setAttribute('opacity','0')}

  // 终端
  const prevTerms=STEPS.slice(0,idx+1).map(x=>x.term);
  terminal.innerHTML=prevTerms.map(t=>`<div class="t-block">${t}</div>`).join('');
  terminal.scrollTop=terminal.scrollHeight;

  // messages
  messagesEl.innerHTML=s.msgs.map(m=>
    `<div class="msg ${m.role}"><div class="role">${m.role}</div><pre>${m.content}</pre></div>`
  ).join('')+`<div style="font-size:0.64rem;color:#b3ac9d;margin-top:0.3rem">${s.detail}</div>`;
  messagesEl.scrollTop=messagesEl.scrollHeight;
}

// 事件
document.querySelectorAll('.station').forEach(el=>{
  el.addEventListener('click',()=>goTo(+el.dataset.i));
});
document.getElementById('btn-next').addEventListener('click',()=>goTo(current+1));
document.getElementById('btn-prev').addEventListener('click',()=>goTo(current-1));
document.getElementById('btn-reset').addEventListener('click',()=>{
  current=-1;
  document.querySelectorAll('.station').forEach(el=>{el.classList.remove('lit','done')});
  document.querySelectorAll('.arrow').forEach(el=>el.classList.remove('lit'));
  terminal.innerHTML='';messagesEl.innerHTML='';
  whaleWrap.style.left='10%';whaleBody.style.fill='#5b9bd5';spout.setAttribute('opacity','0');
  bubbleEl.classList.remove('show');
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')goTo(current+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')goTo(current-1);
});

setTimeout(()=>goTo(0),400);
</script>
</body>
</html>
