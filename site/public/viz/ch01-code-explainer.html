<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0c10;
  --panel: #0d1117;
  --border: #1e2430;
  --text: #c9d1d9;
  --text-dim: #484f58;
  --accent: #58a6ff;
  --accent-bg: rgba(88,166,255,0.08);
  --accent-border: rgba(88,166,255,0.4);
  --kw: #ff7b72;
  --str: #a5d6ff;
  --fn: #d2a8ff;
  --bi: #79c0ff;
  --cm: #484f58;
  --num: #79c0ff;
  --green: #3fb950;
  --green-bg: rgba(63,185,80,0.06);

body {
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.container {
  display: flex;
  gap: 16px;
  padding: 16px;
  max-width: 1280px;
  margin: 0 auto;
  min-height: calc(100vh - 32px);
}

/* -- Code Panel -- */
.code-panel {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.code-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(13,17,23,0.8);
}

.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-r { background: #e05252; }
.dot-y { background: #e8b863; }
.dot-g { background: #7ec384; }

.code-header span {
  margin-left: 8px;
  font-size: 12px;
  color: var(--text-dim);
}

.code-body {
  padding: 16px 0;
  overflow-x: auto;
  overflow-y: auto;
  flex: 1;
}

.code-line {
  display: flex;
  align-items: flex-start;
  padding: 2px 16px 2px 0;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
  border-left: 3px solid transparent;
  min-height: 24px;
  line-height: 24px;
}

.code-line:hover {
  background: var(--accent-bg);
}

.code-line.active {
  background: var(--accent-bg);
  border-left-color: var(--accent);
}

.code-line.blank {
  cursor: default;
  pointer-events: none;
}

.code-line.blank:hover {
  background: transparent;
}

.line-num {
  flex: 0 0 44px;
  text-align: right;
  padding-right: 16px;
  color: var(--text-dim);
  font-size: 13px;
  user-select: none;
  line-height: 24px;
}

.line-code {
  white-space: pre;
  font-size: 13px;
  line-height: 24px;
}

/* Syntax colors */
.kw  { color: var(--kw); }
.str { color: var(--str); }
.bi  { color: var(--bi); }
.cm  { color: var(--cm); font-style: italic; }
.fn  { color: var(--fn); }
.op  { color: var(--text); }
.pr  { color: var(--text); }
.num { color: var(--num); }

/* -- Explain Panel -- */
.explain-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.explain-default {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.8;
  flex: 1;
}

.explain-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.3s ease-out, transform 0.3s ease-out;
  pointer-events: none;
  overflow-y: auto;
  flex: 1;
}

.explain-card.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.card-label {
  font-size: 12px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
}

.card-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
}

.card-explain {
  font-size: 13px;
  color: var(--text);
  line-height: 1.9;
  opacity: 0.88;
}

.card-why {
  background: rgba(88,166,255,0.06);
  border-left: 3px solid var(--accent);
  border-radius: 0 6px 6px 0;
  padding: 12px 14px;
  font-size: 12.5px;
  line-height: 1.85;
  color: var(--text);
  opacity: 0.85;
}

.card-observe {
  background: var(--green-bg);
  border-left: 3px solid var(--green);
  border-radius: 0 6px 6px 0;
  padding: 12px 14px;
  font-size: 12.5px;
  line-height: 1.85;
  color: var(--text);
  opacity: 0.85;
}

.hint {
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  padding: 12px;
}

/* -- Responsive -- */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
    padding: 8px;
    gap: 8px;
  }
  .explain-panel {
    min-height: 280px;
  }
}

const codeBody = document.getElementById('codeBody');
lines.forEach(line => {
  const el = document.createElement('div');
  el.className = 'code-line' + (line.blank ? ' blank' : '');
  el.dataset.num = line.num;
  el.innerHTML = '<span class="line-num">' + line.num + '</span><span class="line-code">' + line.code + '</span>';
  if (!line.blank) {
    el.addEventListener('click', () => selectLine(line.num));
  }
  codeBody.appendChild(el);
});

let activeLine = null;
const defaultPrompt = document.getElementById('defaultPrompt');
const explainCard = document.getElementById('explainCard');
const cardLabel = document.getElementById('cardLabel');
const cardTitle = document.getElementById('cardTitle');
const cardExplain = document.getElementById('cardExplain');
const cardWhy = document.getElementById('cardWhy');
const cardObserve = document.getElementById('cardObserve');

function selectLine(num) {
  // For multi-line entries, map to the first line
  const key = (num >= 21 && num <= 25) ? 21 : num;
  if (activeLine === num) return;

  // Remove previous active
  document.querySelectorAll('.code-line.active').forEach(el => el.classList.remove('active'));

  // Set new active (highlight range for multi-line)
  if (key === 21) {
    for (let i = 21; i <= 25; i++) {
      const el = document.querySelector('.code-line[data-num="' + i + '"]');
      if (el) el.classList.add('active');
    }
  } else {
    const el = document.querySelector('.code-line[data-num="' + num + '"]');
    if (el) el.classList.add('active');
  }

  activeLine = num;
  const data = explanations[key];
  if (!data) return;

  defaultPrompt.style.display = 'none';

  explainCard.classList.remove('visible');
  requestAnimationFrame(() => {
    explainCard.style.transition = 'none';
    explainCard.style.opacity = '0';
    explainCard.style.transform = 'translateY(12px)';
    void explainCard.offsetHeight;
    explainCard.style.transition = '';
    explainCard.style.opacity = '';
    explainCard.style.transform = '';

    cardLabel.textContent = data.label;
    cardTitle.textContent = data.title;
    cardExplain.textContent = data.explain;
    cardWhy.innerHTML = '<strong>为什么这么写：</strong>' + data.why;
    cardObserve.innerHTML = '<strong>在 Claude Code 里：</strong>' + data.observe;
    explainCard.classList.add('visible');
  });
}
</script>
</body>
</html>
