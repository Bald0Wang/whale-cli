<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="UTF-8">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #1c1816;
  font-family: 'JetBrains Mono', monospace;
  color: #ebe0d2;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 12px;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* ── Layer tabs ── */
.layer-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  flex-shrink: 0;
}

.layer-tab {
  padding: 5px 12px;
  border: 1px solid #332d28;
  border-radius: 6px;
  background: transparent;
  color: #6a6058;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}

.layer-tab:hover {
  border-color: #554a42;
  color: #ebe0d2;
}

.layer-tab.active {
  border-color: #D77757;
  color: #D77757;
  background: rgba(215, 119, 87, 0.08);
}

/* ── Tree area ── */
.tree-area {
  background: #0f0e0c;
  border: 1px solid #332d28;
  border-radius: 8px;
  padding: 12px 16px;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.tree-area::-webkit-scrollbar { width: 6px; }
.tree-area::-webkit-scrollbar-track { background: transparent; }
.tree-area::-webkit-scrollbar-thumb { background: #332d28; border-radius: 3px; }
.tree-area::-webkit-scrollbar-thumb:hover { background: #554a42; }

/* ── Tree nodes ── */
.tree-node {
  line-height: 28px;
  white-space: nowrap;
}

.tree-row {
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 6px;
  border-radius: 4px;
  cursor: default;
  position: relative;
  transition: background 0.15s ease;
}

.tree-row:hover {
  background: rgba(215, 119, 87, 0.06);
}

.tree-row.highlighted {
  background: rgba(215, 119, 87, 0.12);
  border-left: 2px solid #D77757;
  margin-left: -2px;
}

.tree-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 28px;
  font-size: 9px;
  color: #6a6058;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.2s ease;
  user-select: none;
}

.tree-toggle.open {
  transform: rotate(0deg);
}

.tree-toggle.closed {
  transform: rotate(0deg);
}

.tree-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 28px;
  font-size: 10px;
  flex-shrink: 0;
  margin-right: 6px;
}

.tree-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tree-desc {
  color: #6a6058;
  margin-left: 12px;
  font-size: 12px;
  flex-shrink: 0;
}

/* Children container for animation */
.tree-children {
  overflow: hidden;
  transition: max-height 0.25s ease, opacity 0.2s ease;
}

.tree-children.collapsed {
  max-height: 0 !important;
  opacity: 0;
  pointer-events: none;
}

.tree-children.expanded {
  opacity: 1;
}

/* ── Colors ── */
.c-dir  { color: #D77757; }
.c-py   { color: #e8b863; }
.c-md   { color: #7ec384; }
.c-html { color: #6477e0; }
.c-cfg  { color: #6a6058; }
.c-dim  { color: #6a6058; }

/* ── Tooltip ── */
.tooltip {
  position: fixed;
  background: #2a2420;
  color: #ebe0d2;
  border: 1px solid #332d28;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  pointer-events: none;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.15s ease;
  max-width: 300px;
  white-space: normal;
  line-height: 1.5;
}

.tooltip.visible {
  opacity: 1;
}
</style>

// ── State ──
let activeLayer = null;
const tooltip = document.getElementById('tooltip');
const treeArea = document.getElementById('treeArea');

// ── File type helpers ──
function getTypeClass(type) {
  const map = { dir: 'c-dir', py: 'c-py', md: 'c-md', html: 'c-html', cfg: 'c-cfg' };
  return map[type] || 'c-dim';
}

function getFileIcon(type, expanded) {
  if (type === 'dir') return expanded ? '▼' : '▶';
  return '·';
}

// ── Build tree DOM ──
function buildNode(node, depth) {
  const wrapper = document.createElement('div');
  wrapper.className = 'tree-node';

  const row = document.createElement('div');
  row.className = 'tree-row';
  row.style.paddingLeft = (depth * 20 + 6) + 'px';

  const isDir = node.type === 'dir';
  const hasChildren = isDir && node.children && node.children.length > 0;
  let expanded = node.expanded || false;

  // Toggle arrow
  const toggle = document.createElement('span');
  toggle.className = 'tree-toggle';
  if (isDir) {
    toggle.textContent = expanded ? '▼' : '▶';
    toggle.style.cursor = 'pointer';
  } else {
    toggle.textContent = '';
    toggle.style.width = '16px';
  }

  // Icon (dot for files)
  const icon = document.createElement('span');
  icon.className = 'tree-icon ' + getTypeClass(node.type);
  if (!isDir) {
    icon.textContent = '·';
    icon.style.fontSize = '16px';
    icon.style.fontWeight = 'bold';
  }

  // Label
  const label = document.createElement('span');
  label.className = 'tree-label ' + getTypeClass(node.type);
  if (node.dimLabel) {
    label.classList.add('c-dim');
  }
  label.textContent = node.name;

  // Inline desc for directories (visible on wider screens)
  const desc = document.createElement('span');
  desc.className = 'tree-desc';
  if (isDir && node.desc && depth < 2) {
    desc.textContent = node.desc;
  }

  row.appendChild(toggle);
  if (!isDir) row.appendChild(icon);
  row.appendChild(label);
  row.appendChild(desc);

  // Store node data for layer highlighting and tooltip
  row._nodeData = node;
  row._layers = node.layers || [];

  // Tooltip on hover
  if (node.desc) {
    row.addEventListener('mouseenter', (e) => {
      showTooltip(e, node.desc);
    });
    row.addEventListener('mousemove', (e) => {
      moveTooltip(e);
    });
    row.addEventListener('mouseleave', () => {
      hideTooltip();
    });
  }

  wrapper.appendChild(row);

  // Children container
  if (isDir) {
    const childrenEl = document.createElement('div');
    childrenEl.className = 'tree-children';

    if (hasChildren) {
      node.children.forEach(child => {
        childrenEl.appendChild(buildNode(child, depth + 1));
      });
    }

    if (expanded) {
      childrenEl.classList.add('expanded');
      // Set a large initial max-height, will be recalculated
      childrenEl.style.maxHeight = childrenEl.scrollHeight + 5000 + 'px';
    } else {
      childrenEl.classList.add('collapsed');
      childrenEl.style.maxHeight = '0px';
    }

    wrapper.appendChild(childrenEl);

    // Click to toggle
    const toggleDir = () => {
      expanded = !expanded;
      toggle.textContent = expanded ? '▼' : '▶';

      if (expanded) {
        childrenEl.classList.remove('collapsed');
        childrenEl.classList.add('expanded');
        // Measure actual height
        childrenEl.style.maxHeight = '0px';
        requestAnimationFrame(() => {
          childrenEl.style.maxHeight = childrenEl.scrollHeight + 'px';
          // After transition, allow natural height for nested toggles
          const onEnd = () => {
            if (expanded) childrenEl.style.maxHeight = 'none';
            childrenEl.removeEventListener('transitionend', onEnd);
          };
          childrenEl.addEventListener('transitionend', onEnd);
        });
      } else {
        // Set explicit height first so transition works
        childrenEl.style.maxHeight = childrenEl.scrollHeight + 'px';
        requestAnimationFrame(() => {
          childrenEl.style.maxHeight = '0px';
          childrenEl.classList.remove('expanded');
          childrenEl.classList.add('collapsed');
        });
      }
    };

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleDir();
    });

    label.style.cursor = 'pointer';
    label.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleDir();
    });
  }

  return wrapper;
}

// ── Tooltip ──
function showTooltip(e, text) {
  tooltip.textContent = text;
  tooltip.classList.add('visible');
  moveTooltip(e);
}

function moveTooltip(e) {
  const pad = 12;
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  const rect = tooltip.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - 10) {
    x = e.clientX - rect.width - pad;
  }
  if (y + rect.height > window.innerHeight - 10) {
    y = e.clientY - rect.height - pad;
  }
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

// ── Layer highlighting ──
function setActiveLayer(layer) {
  if (activeLayer === layer) {
    activeLayer = null;
  } else {
    activeLayer = layer;
  }

  // Update tab buttons
  document.querySelectorAll('.layer-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.layer === activeLayer);
  });

  // Update row highlights
  document.querySelectorAll('.tree-row').forEach(row => {
    const nodeLayers = row._layers;
    if (activeLayer && nodeLayers && nodeLayers.includes(activeLayer)) {
      row.classList.add('highlighted');
    } else {
      row.classList.remove('highlighted');
    }
  });

  // If a layer is active, auto-expand directories that contain highlighted items
  if (activeLayer) {
    expandLayerPaths(activeLayer);
  }
}

function expandLayerPaths(layer) {
  // Find all highlighted rows and ensure their parent tree-children are expanded
  document.querySelectorAll('.tree-row.highlighted').forEach(row => {
    let el = row.parentElement; // tree-node
    while (el) {
      const parentChildren = el.parentElement;
      if (parentChildren && parentChildren.classList.contains('tree-children') && parentChildren.classList.contains('collapsed')) {
        // Expand it
        parentChildren.classList.remove('collapsed');
        parentChildren.classList.add('expanded');
        parentChildren.style.maxHeight = 'none';
        // Update toggle
        const parentNode = parentChildren.parentElement;
        if (parentNode) {
          const tog = parentNode.querySelector(':scope > .tree-row .tree-toggle');
          if (tog) tog.textContent = '▼';
        }
      }
      el = el.parentElement;
    }
  });
}

// ── Layer tab helpers for data: mark layers recursively ──
function propagateLayers(node) {
  if (!node.children) return;
  node.children.forEach(child => {
    // Inherit parent layer if child doesn't have its own
    // (We already set them in data, this is for directories that should light up)
    propagateLayers(child);
  });
}

// ── Init ──
propagateLayers(treeData);
treeArea.appendChild(buildNode(treeData, 0));

document.querySelectorAll('.layer-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    setActiveLayer(tab.dataset.layer);
  });
});

// Fix initial expanded max-height after render
requestAnimationFrame(() => {
  document.querySelectorAll('.tree-children.expanded').forEach(el => {
    el.style.maxHeight = 'none';
  });
});
</script>
</body>
</html>
