// Build code lines
const codeBody = document.getElementById('codeBody');
lines.forEach(line => {
  const el = document.createElement('div');
  el.className = 'code-line' + (line.blank ? ' blank' : '');
  el.dataset.num = line.num;
  el.innerHTML = '<span class="line-num">' + line.num + '</span><span class="line-code">' + line.code + '</span>';
  if (!line.blank) {
    el.addEventListener('click', () => selectLine(line.num));
  }
  codeBody.appendChild(el);
});

// Multi-line groupings
const lineGroups = {
  1: [1,2,3], 2: [1,2,3], 3: [1,2,3],
  11: [11,12,13,14], 12: [11,12,13,14], 13: [11,12,13,14], 14: [11,12,13,14],
  16: [16,17,18,19], 18: [16,17,18,19], 19: [16,17,18,19],

  26: [26,27,28,29,30], 27: [26,27,28,29,30], 29: [26,27,28,29,30], 30: [26,27,28,29,30],
  32: [32,33], 33: [32,33],
  35: [35,36,37,38],
  40: [40,41,42,43], 41: [40,41,42,43], 42: [40,41,42,43], 43: [40,41,42,43],
  45: [45,46], 46: [45,46],

const lineKeyMap = {
  2:1, 3:1,
  12:11, 13:11, 14:11,
  18:16, 19:16,
  22:21, 23:21, 24:21,
  27:26, 29:26, 30:26,
  33:32,
  41:40, 42:40, 43:40,
  46:45,
};

let activeLine = null;
const defaultPrompt = document.getElementById('defaultPrompt');
const explainCard = document.getElementById('explainCard');
const cardLabel = document.getElementById('cardLabel');
const cardTitle = document.getElementById('cardTitle');
const cardExplain = document.getElementById('cardExplain');
const cardDetail = document.getElementById('cardDetail');
const cardGuard = document.getElementById('cardGuard');

function selectLine(num) {
  if (activeLine === num) return;

  document.querySelectorAll('.code-line.active').forEach(el => el.classList.remove('active'));

  const group = lineGroups[num];
  if (group) {
    group.forEach(n => {
      const el = document.querySelector('.code-line[data-num="' + n + '"]');
      if (el) el.classList.add('active');
    });
  } else {
    const el = document.querySelector('.code-line[data-num="' + num + '"]');
    if (el) el.classList.add('active');
  }

  activeLine = num;
  const key = lineKeyMap[num] || num;
  const data = explanations[key];
  if (!data) return;

  defaultPrompt.style.display = 'none';

  explainCard.classList.remove('visible');
  requestAnimationFrame(() => {
    explainCard.style.transition = 'none';
    explainCard.style.opacity = '0';
    explainCard.style.transform = 'translateY(12px)';
    void explainCard.offsetHeight;
    explainCard.style.transition = '';
    explainCard.style.opacity = '';
    explainCard.style.transform = '';

    cardLabel.innerHTML = data.label;
    cardTitle.textContent = data.title;
    cardExplain.textContent = data.explain;
    cardDetail.innerHTML = data.detail;
    cardGuard.innerHTML = data.guard;
    explainCard.classList.add('visible');
  });
}
