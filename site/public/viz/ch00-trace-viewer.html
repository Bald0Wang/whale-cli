<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace Viewer - 51 次工具调用</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:#faf9f5; --bg1:#f5f0e8; --card:#ffffff; --card2:#fbfaf6;
  --border:#e6dfd8; --border2:#d9d3c2;
  --ink:#29261f; --text:#3d382e; --text2:#7d766a; --text3:#b3ac9d;
  --accent:#d97757; --accent-deep:#c45f3c;
  --teal:#0e7c66; --green:#2e7d4f; --red:#c2402a; --purple:#8a63c9;
  --blue:#5468c8;
  --shadow-sm:0 1px 2px rgba(41,38,31,0.05);
  --shadow-md:0 1px 3px rgba(41,38,31,0.06), 0 10px 28px -10px rgba(41,38,31,0.14);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, 'Inter', system-ui, sans-serif;
  background: var(--bg0);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
}

.container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-height: 400px;
}

/* ── Top bar ─────────────────────────────────── */
.top-bar {
  padding: 16px 24px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}
.top-bar h1 {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 2px;
  letter-spacing: -0.01em;
}
.top-bar h1 span { color: var(--accent); }
.top-bar .subtitle {
  font-size: 12px;
  color: var(--text2);
}
.stats-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 10px;
  font-size: 12px;
  flex-wrap: wrap;
}
.stat-item { color: var(--text2); }
.stat-item .num { color: var(--ink); font-weight: 600; }
.stat-item.read .num { color: var(--blue); }
.stat-item.bash .num { color: var(--green); }

/* ── Controls row ─────────────────────────────── */
.controls-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
}
.play-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border: 1px solid var(--border2);
  border-radius: 6px;
  background: var(--card2);
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.play-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--card);
}
.play-btn.playing {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}
.play-btn .icon { font-size: 10px; }
.step-counter {
  margin-left: auto;
  color: var(--accent);
  font-weight: 500;
  font-size: 12px;
}
.token-counter-inline {
  font-size: 12px;
  color: var(--text2);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 400;
}
.token-counter-inline .num {
  color: var(--ink);
  font-weight: 500;
  transition: all 0.4s ease;
}
.kbd-hint {
  font-size: 11px;
  color: var(--text3);
}
.kbd-hint kbd {
  display: inline-block;
  padding: 1px 5px;
  border: 1px solid var(--border2);
  border-radius: 3px;
  background: var(--bg1);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text2);
}

/* ── Main area ─────────────────────────────────── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Left panel (event list) ───────────────────── */
.left-panel {
  width: 50%;
  background: var(--bg0);
  overflow-y: auto;
  border-right: 1px solid var(--border);
  padding: 4px 0;
}
.left-panel::-webkit-scrollbar { width: 6px; }
.left-panel::-webkit-scrollbar-track { background: transparent; }
.left-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* Phase labels */
.phase-label {
  padding: 10px 16px 4px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 8px;
}
.phase-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Event rows */
.event-row {
  padding: 7px 14px 7px 16px;
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background 0.15s, border-left-color 0.3s ease;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  position: relative;
}
.event-row:hover { background: var(--bg1); }
.event-row.active {
  background: var(--bg1);
  border-left-color: var(--accent);
  box-shadow: inset 4px 0 12px -6px rgba(217,119,87,0.2);
}

/* Thinking pattern indicator */
.thinking-dot {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.4;
}

/* Text event */
.event-row.type-text .event-content { color: var(--text2); font-size: 12px; }

/* Tool use */
.event-row.type-tool_use.tool-Read .event-detail-path { color: var(--teal); }
.event-row.type-tool_use.tool-Bash .event-detail-path { color: var(--green); }

/* Tool result */
.event-row.type-tool_result {
  padding: 3px 14px 3px 27px;
  opacity: 0.55;
  border-left-color: transparent;
}
.event-row.type-tool_result .event-content {
  font-size: 11px;
  color: var(--text3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
.event-row.type-tool_result.expanded {
  opacity: 0.85;
  padding: 6px 14px 6px 27px;
}
.event-row.type-tool_result.expanded .event-content {
  white-space: pre-wrap;
  word-break: break-all;
}

/* Badges */
.tool-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 20px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
  letter-spacing: 0.02em;
}
.tool-badge.read-badge {
  background: rgba(14,124,102,0.1);
  color: var(--teal);
  padding: 0 7px;
}
.tool-badge.bash-badge {
  background: rgba(46,125,79,0.1);
  color: var(--green);
  padding: 0 7px;
}
.tool-badge.text-badge {
  background: rgba(217,119,87,0.1);
  color: var(--accent);
  padding: 0 6px;
  font-size: 10px;
}
.tool-badge.result-badge {
  background: rgba(125,118,106,0.08);
  color: var(--text3);
  padding: 0 5px;
  font-size: 10px;
}

.event-content {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.event-detail-path {
  color: var(--ink);
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
}
.event-detail-dim {
  color: var(--text3);
  font-size: 11px;
}

/* ── Right panel (detail) ──────────────────────── */
.right-panel {
  width: 50%;
  background: var(--card);
  overflow-y: auto;
  padding: 0;
  position: relative;
}
.right-panel::-webkit-scrollbar { width: 6px; }
.right-panel::-webkit-scrollbar-track { background: transparent; }
.right-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.detail-wrapper {
  padding: 20px 24px;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(12px); }
  to   { opacity: 1; transform: translateX(0); }
}

.detail-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text3);
  font-size: 13px;
  gap: 6px;
  padding: 20px;
}
.detail-empty .hint { font-size: 11px; color: var(--text3); }

.detail-header {
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.detail-header .detail-type {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}
.detail-header .detail-type.text-type { color: var(--accent); }
.detail-header .detail-type.read-type { color: var(--teal); }
.detail-header .detail-type.bash-type { color: var(--green); }
.detail-header .detail-type.result-type { color: var(--text3); }
.detail-header .detail-name {
  font-size: 13px;
  color: var(--ink);
  word-break: break-all;
  font-family: 'JetBrains Mono', monospace;
}
.detail-body {
  font-size: 12.5px;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.65;
  font-family: 'JetBrains Mono', monospace;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
}

/* ── Heatmap (bottom bar) ──────────────────────── */
.heatmap-section {
  flex-shrink: 0;
  padding: 12px 24px 14px;
  background: var(--card);
  border-top: 1px solid var(--border);
}
.heatmap-title {
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 8px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.heatmap-bars {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
}
.heatmap-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}
.heatmap-bar {
  height: 14px;
  border-radius: 3px;
  min-width: 8px;
  transition: width 0.6s ease;
}
.heatmap-bar.animate-in {
  animation: barGrow 0.6s ease forwards;
}
@keyframes barGrow {
  from { width: 0; opacity: 0; }
  to   { opacity: 1; }
}
.heatmap-label {
  color: var(--text2);
  white-space: nowrap;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
.heatmap-count {
  color: var(--ink);
  font-size: 11px;
  font-weight: 600;
}
</style>
</head>

// ─── Select event ────────────────────────────────
function selectEvent(idx) {
  if (idx < 0 || idx >= EVENTS.length) return;

  // Deactivate previous
  if (activeIndex >= 0) {
    const prev = leftPanel.querySelector('[data-index="' + activeIndex + '"]');
    if (prev) prev.classList.remove('active');
  }
  activeIndex = idx;
  const row = leftPanel.querySelector('[data-index="' + idx + '"]');
  if (row) {
    row.classList.add('active');
    row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // Toggle tool_result expand
  const ev = EVENTS[idx];
  if (ev.type === 'tool_result' && row) {
    row.classList.toggle('expanded');
  }

  // Update step counter
  if (ev.type === 'tool_use') {
    const toolIdx = toolCallIndices.indexOf(idx) + 1;
    stepCounter.textContent = '第 ' + toolIdx + ' / 51 步';
  } else {
    const nearestTool = toolCallIndices.filter(i => i <= idx).length;
    stepCounter.textContent = nearestTool > 0 ? '第 ' + nearestTool + ' / 51 步' : '开始分析';
  }

  // Update token counter
  const tokens = tokenEstimates[idx];
  tokenNum.textContent = tokens >= 1000 ? (tokens / 1000).toFixed(1) + 'k' : tokens;

  // Right panel detail
  showDetail(ev);
}

function showDetail(ev) {

// ─── Keyboard navigation ─────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const next = activeIndex < 0 ? 0 : Math.min(activeIndex + 1, EVENTS.length - 1);
    selectEvent(next);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = Math.max(activeIndex - 1, 0);
    selectEvent(prev);
  } else if (e.key === ' ') {
    e.preventDefault();
    toggleAutoplay();
  }
});

// ─── Autoplay ────────────────────────────────────
function toggleAutoplay() {
  if (isPlaying) {
    stopAutoplay();
  } else {
    startAutoplay();
  }
}

function startAutoplay() {
  isPlaying = true;
  playBtn.classList.add('playing');
  playIcon.innerHTML = '&#9646;&#9646;';
  playLabel.textContent = '暂停';
  if (activeIndex < 0) activeIndex = -1;
  advanceAutoplay();
}

function stopAutoplay() {
  isPlaying = false;
  playBtn.classList.remove('playing');
  playIcon.innerHTML = '&#9654;';
  playLabel.textContent = '自动播放';
  if (playTimer) { clearTimeout(playTimer); playTimer = null; }
}

function advanceAutoplay() {
  if (!isPlaying) return;
  const next = activeIndex + 1;
  if (next >= EVENTS.length) {
    stopAutoplay();
    return;
  }
  selectEvent(next);
  playTimer = setTimeout(advanceAutoplay, 800);
}

playBtn.addEventListener('click', toggleAutoplay);

      const m = ev.detail.match(/\.\/src\/([a-z-]+)/);
      if (m) {
        const dir = 'src/' + m[1];
        dirCounts[dir] = (dirCounts[dir] || 0) + 1;
      }
    }
  });

  const sorted = Object.entries(dirCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);

                  dir.includes('agent') ? 'var(--accent)' :
                  dir.includes('channel') ? 'var(--purple)' :
                  dir.includes('infra') ? 'var(--teal)' : 'var(--text3)';
    const item = document.createElement('div');
    item.className = 'heatmap-item';

      ';animation-delay:' + (i * 0.08) + 's"></div>' +
      '<span class="heatmap-count">' + count + '</span>';
    container.appendChild(item);
  });
}
