<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Assembly Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:#faf9f5; --bg1:#f5f0e8; --card:#ffffff; --card2:#fbfaf6;
  --border:#e6dfd8; --border2:#d9d3c2;
  --ink:#29261f; --text:#3d382e; --text2:#7d766a; --text3:#b3ac9d;
  --accent:#d97757; --accent-deep:#c45f3c;
  --teal:#0e7c66; --green:#2e7d4f; --red:#c2402a; --purple:#8a63c9;
  --shadow-sm:0 1px 2px rgba(41,38,31,0.05);
  --shadow-md:0 1px 3px rgba(41,38,31,0.06), 0 10px 28px -10px rgba(41,38,31,0.14);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg0);
  background-image: radial-gradient(ellipse at 50% 0%, rgba(217,119,87,0.04) 0%, transparent 60%);
  color: var(--ink);
  line-height: 1.5;
  overflow-x: hidden;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 20px 16px 32px;
}

/* -- Header -- */
.header {
  text-align: center;
  margin-bottom: 20px;
}
.header h1 {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
  letter-spacing: 0.02em;
}
.header p {
  font-size: 11px;
  color: var(--text2);
}

/* -- Chapter Tabs -- */
.chapter-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 20px;
  background: var(--bg1);
  border-radius: 8px;
  border: 1px solid var(--border);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.chapter-tabs::-webkit-scrollbar {
  height: 4px;
}
.chapter-tabs::-webkit-scrollbar-track {
  background: transparent;
}
.chapter-tabs::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 2px;
}
.chapter-tab {
  flex: 0 0 auto;
  padding: 10px 14px;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--text2);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  white-space: nowrap;
}
.chapter-tab.active {
  color: var(--ink);
  background: var(--card);
}
.chapter-tab.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 12px;
  right: 12px;
  height: 2px;
  background: var(--accent);
  border-radius: 1px 1px 0 0;
}
.chapter-tab:hover:not(.active) {
  color: var(--text);
  background: var(--card2);
}

/* -- Token Summary Bar -- */
.token-summary {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding: 10px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
}
.token-summary-label {
  font-size: 11px;
  color: var(--text2);
  white-space: nowrap;
}
.token-bar-track {
  flex: 1;
  height: 6px;
  background: var(--bg1);
  border-radius: 3px;
  overflow: hidden;
}
.token-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #c8942e);
  border-radius: 3px;
  transition: width 0.4s ease;
  min-width: 1px;
}
.token-total {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
  min-width: 100px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* -- Layers Stack -- */
.layers-stack {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* -- Single Layer -- */
.layer {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: all 0.35s ease, max-height 0.4s ease, opacity 0.3s ease;
  position: relative;
  max-height: 200px;
  box-shadow: var(--shadow-sm);
}
.layer.ghosted {
  opacity: 0.35;
  pointer-events: none;
  max-height: 60px;
}
.layer.ghosted .layer-header { cursor: default; }
.layer.hidden-layer {
  max-height: 0;
  opacity: 0;
  margin: 0;
  padding: 0;
  border: none;
  overflow: hidden;
}

/* left color stripe */
.layer::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 8px 0 0 8px;
}
.layer[data-color="green"]::before  { background: var(--green); }
.layer[data-color="blue"]::before   { background: #faf9f5; }
.layer[data-color="orange"]::before { background: var(--accent); }
.layer[data-color="yellow"]::before { background: #b8892e; }
.layer[data-color="purple"]::before { background: var(--purple); }

/* -- Layer Header -- */
.layer-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
  position: relative;
}

.layer-icon {
  font-size: 9px;
  font-weight: 600;
  flex-shrink: 0;
  width: 32px;
  height: 20px;
  line-height: 20px;
  text-align: center;
  background: var(--bg1);
  border-radius: 3px;
  color: var(--text2);
  letter-spacing: 0.5px;
}

.layer-info { flex: 1; min-width: 0; }
.layer-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.layer.disabled .layer-name {
  text-decoration: line-through;
  color: var(--text3);
}
.layer-desc {
  font-size: 10px;
  color: var(--text2);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* -- Badges -- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 9px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 4px;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-cache {
  background: rgba(46, 125, 79, 0.1);
  color: var(--green);
}
.badge-dynamic {
  background: rgba(217, 119, 87, 0.1);
  color: var(--accent);
}
.badge-new {
  background: rgba(46, 125, 79, 0.12);
  color: var(--green);
  font-weight: 600;
}
.badge-ghost {
  background: rgba(125, 118, 106, 0.12);
  color: var(--text2);
}

/* -- Token Count (right side) -- */
.layer-tokens {
  font-size: 11px;
  font-weight: 500;
  color: var(--text3);
  white-space: nowrap;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  min-width: 50px;
  text-align: right;
}
.layer:not(.disabled):not(.ghosted) .layer-tokens { color: var(--text2); }

/* -- Toggle Switch -- */
.toggle-switch {
  position: relative;
  width: 32px;
  height: 18px;
  flex-shrink: 0;
}
.toggle-switch input {
  opacity: 0; width: 0; height: 0; position: absolute;
}
.toggle-slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--border);
  border-radius: 9px;
  transition: background 0.25s ease;
}
.toggle-slider::before {
  content: '';
  position: absolute;
  height: 14px; width: 14px;
  left: 2px; bottom: 2px;
  background: var(--card);
  border-radius: 50%;
  transition: all 0.25s ease;
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}
.toggle-switch input:checked + .toggle-slider { background: var(--accent); }
.toggle-switch input:checked + .toggle-slider::before {
  transform: translateX(14px);
  background: var(--card);
}

/* -- Layer Content (expandable) -- */
.layer-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease, padding 0.3s ease;
  padding: 0 14px;
}
.layer-content.expanded {
  max-height: 300px;
  padding: 0 14px 12px;
}
.layer-code {
  font-size: 11px;
  line-height: 1.6;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-all;
}
.layer-code .key { color: #4a5ec0; }
.layer-code .str { color: var(--green); }
.layer-code .dim { color: var(--text3); }
.layer-code .hl  { color: #a07020; }
.layer-code .act { color: var(--accent); }

/* -- Ghost overlay label -- */
.ghost-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
.ghost-label {
  font-size: 10px;
  color: var(--text2);
  background: rgba(250, 249, 245, 0.85);
  padding: 3px 10px;
  border-radius: 4px;
  border: 1px dashed var(--border2);
}

/* -- Connector lines -- */
.connector {
  width: 2px;
  height: 6px;
  background: var(--border);
  margin: 0 auto;
  transition: opacity 0.3s ease;
}
.connector.hidden-connector { opacity: 0; height: 0; }

/* -- Footer -- */
.footer {
  margin-top: 16px;
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 9px;
  color: var(--text2);
}
.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}
</style>
</head>

        content: '<span class="dim">// CLAUDE.md</span>\n<span class="str">"本项目用 pnpm，不用 npm\n 测试命令: pnpm test\n 代码风格: 单引号, 2 空格缩进\n TypeScript strict mode"</span>'

      {
        id: 'git', icon: 'GIT', name: 'git status', color: 'orange',
        tokens: 100, badge: 'dynamic', badgeText: '每次变化', isNew: false,
        desc: '当前分支、修改文件、提交状态',
        content: '<span class="dim">// git context</span>\n<span class="key">branch</span>: <span class="act">feat/auth-flow</span>\n<span class="key">modified</span>: <span class="hl">src/auth/logout.ts</span>\n<span class="key">staged</span>: <span class="dim">none</span>'
      },
      {
        id: 'history', icon: 'MSG', name: 'conversation history', color: 'orange',
        tokens: 500, badge: 'dynamic', badgeText: '每次变化', isNew: false,
        desc: '之前的对话和工具调用记录',
        content: '<span class="dim">// conversation history</span>\n[<span class="key">user</span>] <span class="str">"修 cookie 问题"</span>\n[<span class="key">assistant</span>] <span class="str">"我先搜索…"</span>\n[<span class="act">tool:Grep</span>] <span class="dim">3 matches</span>\n[<span class="act">tool:Read</span>] <span class="dim">logout.ts:30-50</span>'
      },
      {
        id: 'results', icon: 'RES', name: 'tool results', color: 'yellow',
        tokens: 400, badge: 'dynamic', badgeText: '用后即弃', isNew: false,
        desc: '上一轮工具返回的原始数据',
        content: '<span class="dim">// tool results</span>\n<span class="act">grep</span>: clearCookie found at\n  <span class="hl">logout.ts:47</span>\n  <span class="hl">session.ts:12</span>'
      },
      {
        id: 'memory', icon: 'MEM', name: 'memory / todo', color: 'purple',
        tokens: 100, badge: 'dynamic', badgeText: '跨轮保持', isNew: false,
        desc: '任务进度和跨轮记忆',
        content: '<span class="dim">// memory</span>\n<span class="str">done</span> 定位 cookie 文件\n<span class="act">next</span> 修改 clearCookie\n<span class="dim">todo</span> 跑测试验证'
      },
      {
        id: 'user', icon: 'USR', name: 'user message', color: 'orange',
        tokens: 30, badge: 'dynamic', badgeText: '用户输入', isNew: false,
        desc: '当前这一轮用户说的话',
        content: '<span class="dim">// user message</span>\n<span class="str">"把 logout.ts 第 47 行的\n clearCookie 加上 path 参数"</span>'

    ]
  }
};

// Ghost layers for ch01-ch06 (layers not yet introduced)
const GHOST_LAYERS = [
  { id: 'system', icon: 'SYS', name: 'system prompt', color: 'green', tokens: 800 },
  { id: 'project', icon: 'PRJ', name: 'project context', color: 'blue', tokens: 300 },
  { id: 'git', icon: 'GIT', name: 'git status', color: 'orange', tokens: 100 },
  { id: 'history', icon: 'MSG', name: 'conversation history', color: 'orange', tokens: 500 },
  { id: 'results', icon: 'RES', name: 'tool results', color: 'yellow', tokens: 400 },
  { id: 'memory', icon: 'MEM', name: 'memory / todo', color: 'purple', tokens: 100 }
];

let currentChapter = 'ch01';
let layerStates = {}; // for full mode toggles

function initTabs() {
  const container = document.getElementById('chapterTabs');
  container.innerHTML = CHAPTERS.map(ch =>
    `<button class="chapter-tab${ch.id === currentChapter ? ' active' : ''}"
      data-chapter="${ch.id}" title="${ch.title}"
      onclick="switchChapter('${ch.id}')">${ch.label}</button>`
  ).join('');
}

function switchChapter(chId) {
  currentChapter = chId;
  document.querySelectorAll('.chapter-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.chapter === chId);
  });
  // Reset full mode toggle states
  if (chId === 'full') {
    CHAPTER_DATA.full.activeLayers.forEach(l => { layerStates[l.id] = true; });
  }
  render();
}

function toggleLayer(id) {
  layerStates[id] = !layerStates[id];
  const layerEl = document.querySelector(`.layer[data-id="${id}"]`);
  if (layerEl) {
    layerEl.classList.toggle('disabled', !layerStates[id]);
    const content = layerEl.querySelector('.layer-content');
    if (content) content.classList.toggle('expanded', layerStates[id]);
    const toggle = layerEl.querySelector('input[type="checkbox"]');
    if (toggle) toggle.checked = layerStates[id];
  }
  updateTokens();
}

function getTotalTokens() {
  const data = CHAPTER_DATA[currentChapter];
  if (currentChapter === 'full') {
    return data.activeLayers
      .filter(l => layerStates[l.id] !== false)
      .reduce((s, l) => s + l.tokens, 0);
  }
  return data.totalTokens;
}

function updateTokens() {
  const total = getTotalTokens();
  const pct = Math.min((total / CONTEXT_WINDOW) * 100, 100);
  document.getElementById('tokenBarFill').style.width = pct + '%';
  const el = document.getElementById('tokenTotal');
  animateNumber(el, total);
}

let animFrame = null;
function animateNumber(el, target) {
  const current = parseInt(el.textContent.replace(/[^0-9]/g, '')) || 0;
  if (current === target) { el.textContent = target.toLocaleString() + ' tokens'; return; }
  const diff = target - current;
  const steps = 12;
  let step = 0;
  if (animFrame) cancelAnimationFrame(animFrame);
  function tick() {
    step++;
    const eased = 1 - Math.pow(1 - step / steps, 3);
    const val = Math.round(current + diff * eased);
    el.textContent = val.toLocaleString() + ' tokens';
    if (step < steps) animFrame = requestAnimationFrame(tick);
  }
  tick();
}

function buildActiveLayerHTML(layer, isFull) {
  const badgeMap = { cache: 'badge-cache', dynamic: 'badge-dynamic' };
  let badges = `<span class="badge ${badgeMap[layer.badge] || 'badge-dynamic'}">${layer.badgeText}</span>`;
  if (layer.isNew) badges += `<span class="badge badge-new">新</span>`;
  if (layer.newItems) {
    layer.newItems.forEach(item => {
      badges += `<span class="badge badge-new">${item} 新</span>`;
    });
  }

  const enabled = isFull ? (layerStates[layer.id] !== false) : true;
  const toggleHTML = isFull ? `
    <label class="toggle-switch" onclick="event.stopPropagation()">
      <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleLayer('${layer.id}')">
      <span class="toggle-slider"></span>
    </label>` : '';

  const clickHandler = isFull ? `onclick="toggleLayer('${layer.id}')"` : '';

  return `
    <div class="layer ${!enabled ? 'disabled' : ''}" data-id="${layer.id}" data-color="${layer.color}">
      <div class="layer-header" ${clickHandler}>
        <span class="layer-icon">${layer.icon}</span>
        <div class="layer-info">
          <div class="layer-name">${layer.name} ${badges}</div>
          <div class="layer-desc">${layer.desc}</div>
        </div>
        <span class="layer-tokens">~${layer.tokens}</span>
        ${toggleHTML}
      </div>
      <div class="layer-content${enabled ? ' expanded' : ''}">
        <div class="layer-code">${layer.content}</div>
      </div>
    </div>`;
}

function buildGhostLayerHTML(layer) {
  return `
    <div class="layer ghosted" data-id="ghost_${layer.id}" data-color="${layer.color}">
      <div class="ghost-overlay"><span class="ghost-label">后面章节会加</span></div>
      <div class="layer-header">
        <span class="layer-icon">${layer.icon}</span>
        <div class="layer-info">
          <div class="layer-name">${layer.name} <span class="badge badge-ghost">后续</span></div>
        </div>
        <span class="layer-tokens" style="color:var(--text3)">~${layer.tokens}</span>
      </div>
    </div>`;
}

function render() {
  const stack = document.getElementById('layersStack');
  const data = CHAPTER_DATA[currentChapter];
  const isFull = currentChapter === 'full';
  let html = '';

  // Active layers
  data.activeLayers.forEach((layer, i) => {
    if (i > 0) html += '<div class="connector"></div>';
    html += buildActiveLayerHTML(layer, isFull);
  });

  // Ghost layers (only for ch01-ch06)
  if (!isFull) {
    const activeIds = new Set(data.activeLayers.map(l => l.id));
    const ghosts = GHOST_LAYERS.filter(g => !activeIds.has(g.id));
    ghosts.forEach(ghost => {
      html += '<div class="connector"></div>';
      html += buildGhostLayerHTML(ghost);
    });
  }

  stack.innerHTML = html;
  updateTokens();
}

// Init
initTabs();
CHAPTER_DATA.full.activeLayers.forEach(l => { layerStates[l.id] = true; });
render();
</script>
